function openModal(title, body, {submit='Enregistrer', onSubmit, onDelete, deleteLabel='Supprimer', wide=false}={}){
  modalSubmit=onSubmit;
  document.getElementById('modal-root').innerHTML=`<div class="modal-bg" data-a="close-bg"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="iconbtn" data-a="close" aria-label="Fermer">${ic('x')}</button></div>
    <div class="modal-b">${body}<p class="err" id="merr" hidden></p></div>
    ${onSubmit||onDelete?`<div class="modal-f">${onDelete?`<button type="button" class="btn btn-d left" data-a="m-del">${ic('trash')}${deleteLabel}</button>`:''}<button type="button" class="btn btn-s" data-a="close">Annuler</button>${onSubmit?`<button type="submit" class="btn btn-p">${submit}</button>`:''}</div>`:''}
  </form></div>`;
  window._mDel=onDelete; hydrate();
  const first=document.querySelector('#mform .modal-b input:not([type=hidden]):not([type=radio]):not([type=checkbox]), #mform .modal-b select, #mform .modal-b button');
  if(first && matchMedia('(min-width:861px)').matches) first.focus();
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; modalSubmit=null; }
function mErr(t){ const e=document.getElementById('merr'); if(e){ e.textContent=t; e.hidden=!t; } }
function confirmBox(text, label, fn){
  openModal('Confirmer', `<p>${text}</p>`, {submit:label, onSubmit:()=>{ fn(); return true; }});
  const b=document.querySelector('#mform button[type=submit]'); if(b){ b.className='btn btn-d'; }
}
const val = (f,n) => (f.elements[n]?.value ?? '').trim();
const numv = (f,n) => { const v=val(f,n).replace(/\s/g,'').replace(',','.'); return v===''?NaN:Number(v); };

function addMenu(){
  openModal('Que voulez-vous ajouter ?', `<div class="choices">
    ${[['new-op','depense','out','Une dépense','facture, achat, taxe'],['new-op','revenu','in','Un revenu','loyer, remboursement'],['new-task','','checksq','Une tâche','rappel, chose à faire'],['new-doc','','file','Un document','bail, facture, acte'],['new-projet','','tools','Un projet de travaux','budget, artisans'],['new-bien','','homes','Un bien','maison, logement, local']].map(([a,t,i,l,s])=>`<button type="button" class="choice" data-a="${a}" ${t?`data-type="${t}"`:''}><span class="ic">${ic(i)}</span><span><b>${l}</b><span>${s}</span></span></button>`).join('')}
  </div>`);
}

function opForm(type, o, preset={}){
  const isNew=!o; const dep=type==='depense';
  o = o || {montant:'', date:TODAY, categorie:preset.cat||(dep?'':'Loyer'), libelle:'', repart:{mode:preset.bien?'un':(dep?'un':'un'), parts:preset.bien?[{id:preset.bien,part:100}]:[]}, fournisseur:'', statut:dep?'paye':'paye', justif:null, note:'', projetId:preset.projet||''};
  if(isNew && preset.projet){ const p=S.projets.find(p=>p.id===preset.projet); if(p){ o.categorie='Travaux'; const n=p.biens.length; o.repart={mode:n>1?'plusieurs':'un',parts:p.biens.map((id,i)=>({id,part:n>1?(i<n-1?Math.floor(100/n):100-Math.floor(100/n)*(n-1)):100}))}; } }
  const cats=dep?CATS_DEP:CATS_REV;
  const fourn=[...new Set(S.operations.map(x=>x.fournisseur).filter(Boolean))];
  const pmap=Object.fromEntries((o.repart.parts||[]).map(p=>[p.id,p.part]));
  const mode=o.repart.mode;
  const body=`
  <div class="row2"><div class="f"><label for="m-montant">Montant</label><div class="in-euro"><input class="in" id="m-montant" name="montant" inputmode="decimal" value="${o.montant!==''?String(o.montant).replace('.',','):''}" placeholder="0" required></div></div>
  <div class="f"><label for="m-date">Date</label><input class="in" type="date" id="m-date" name="date" value="${o.date}" required></div></div>
  <div class="f"><label for="m-lib">Libellé</label><input class="in" id="m-lib" name="libelle" value="${esc(o.libelle)}" placeholder="${dep?'Ex. : Facture plombier':'Ex. : Loyer novembre'}" required></div>
  <div class="f"><span class="lab">Catégorie</span><div class="chips" role="radiogroup">${cats.map(c=>`<label><input type="radio" name="categorie" value="${esc(c)}" ${o.categorie===c?'checked':''}>${esc(c)}</label>`).join('')}</div></div>
  <div class="f"><span class="lab">Bien concerné</span>
    <div class="seg" role="radiogroup"><label><input type="radio" name="mode" value="un" ${mode==='un'?'checked':''}>Un bien</label><label><input type="radio" name="mode" value="plusieurs" ${mode==='plusieurs'?'checked':''}>Plusieurs biens</label>${dep?`<label><input type="radio" name="mode" value="global" ${mode==='global'?'checked':''}>Tout le patrimoine</label>`:''}</div>
    <div id="rep-un" ${mode!=='un'?'hidden':''}><select class="in" name="bienUn" id="m-bien" aria-label="Bien">${S.biens.map(b=>`<option value="${b.id}" ${pmap[b.id]?'selected':''}>${esc(b.nom)}</option>`).join('')}</select></div>
    <div id="rep-plus" class="rep" ${mode!=='plusieurs'?'hidden':''}>
      ${S.biens.map(b=>`<div class="rep-row"><input type="checkbox" id="rp-${b.id}" name="rp" value="${b.id}" ${mode==='plusieurs'&&pmap[b.id]?'checked':''} style="width:18px;height:18px;accent-color:#285548"><label for="rp-${b.id}">${esc(b.nom)}</label><input class="in" type="number" min="0" max="100" step="1" id="rpp-${b.id}" name="rpp-${b.id}" value="${mode==='plusieurs'&&pmap[b.id]?pmap[b.id]:''}" aria-label="Part en % pour ${esc(b.nom)}" placeholder="%"><span class="amt" id="rpa-${b.id}"></span></div>`).join('')}
      <div class="filters" style="justify-content:space-between"><button type="button" class="link" data-a="rep-equal">Répartir à parts égales</button><span class="rep-sum" id="rep-sum"></span></div>
    </div>
    <p class="hint" id="rep-global" ${mode!=='global'?'hidden':''}>La dépense sera comptée dans « Patrimoine global », sans être attribuée à un bien.</p>
  </div>
  <div class="row2"><div class="f"><label for="m-four">${dep?'Fournisseur ou artisan':'Payé par'}</label><input class="in" id="m-four" name="fournisseur" list="dl-four" value="${esc(o.fournisseur)}" autocomplete="off"><datalist id="dl-four">${fourn.map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div>
  ${dep?`<div class="f"><label for="m-proj">Projet de travaux</label><select class="in" id="m-proj" name="projetId"><option value="">Aucun</option>${S.projets.map(p=>`<option value="${p.id}" ${o.projetId===p.id?'selected':''}>${esc(p.nom)}</option>`).join('')}</select></div>`:'<div></div>'}</div>
  ${dep?`<div class="row2"><div class="f" id="teom-box" ${o.categorie!=='Taxes'?'hidden':''}><label for="m-teom">Dont ordures ménagères (TEOM)</label><div class="in-euro"><input class="in" id="m-teom" name="teom" inputmode="decimal" value="${o.teom?String(o.teom).replace('.',','):''}"></div><span class="hint">Ligne « Taxe d'enlèvement des ordures ménagères » de l'avis. Récupérable sur les locataires.</span></div>
  <div class="f"><label for="m-ded">Impôts : déductible des loyers ?</label><select class="in" id="m-ded" name="deductible"><option value="auto" ${o.deductible==null?'selected':''}>Automatique (selon la catégorie)</option><option value="oui" ${o.deductible===true?'selected':''}>Oui, déductible</option><option value="non" ${o.deductible===false?'selected':''}>Non déductible</option></select><span class="hint">Seule la part des biens loués compte.</span></div></div>`:''}
  <div class="f"><span class="lab">Statut</span><div class="seg" role="radiogroup"><label><input type="radio" name="statut" value="prevu" ${o.statut==='prevu'?'checked':''}>Prévu</label><label><input type="radio" name="statut" value="a_payer" ${o.statut==='a_payer'?'checked':''}>${dep?'À payer':'À recevoir'}</label><label><input type="radio" name="statut" value="paye" ${o.statut==='paye'?'checked':''}>${dep?'Payé':'Reçu'}</label></div></div>
  <div class="f"><label for="m-file">Justificatif</label>${o.justif?`<p class="small">${o.justif.url?`<a ${hrefAttr(o.justif.url)} target="_blank" rel="noopener">${esc(o.justif.nom)}</a>`:esc(o.justif.nom)} · joint</p>`:''}<input class="in" type="file" id="m-file" name="file" accept="image/*,application/pdf" style="padding:9px 12px"><span class="hint">Photo ou PDF de la facture. Il sera aussi classé dans Documents.</span></div>
  <div class="f"><label for="m-note">Note</label><textarea class="in" id="m-note" name="note" rows="2">${esc(o.note)}</textarea></div>`;
  openModal(isNew?(dep?'Nouvelle dépense':'Nouveau revenu'):(dep?'Modifier la dépense':'Modifier le revenu'), body, {
    onSubmit: async f => {
      const montant=numv(f,'montant'); if(!(montant>0)) return mErr('Indiquez un montant supérieur à 0 €.');
      if(!val(f,'date')) return mErr('Choisissez une date.');
      if(!val(f,'libelle')) return mErr('Donnez un libellé court, par exemple « Facture plombier ».');
      const cat=f.querySelector('input[name=categorie]:checked')?.value; if(!cat) return mErr('Choisissez une catégorie.');
      const md=f.querySelector('input[name=mode]:checked').value; let ps=[];
      if(md==='un') ps=[{id:val(f,'bienUn'),part:100}];
      else if(md==='plusieurs'){ ps=[...f.querySelectorAll('input[name=rp]:checked')].map(c=>({id:c.value,part:Number(f.elements['rpp-'+c.value].value)||0})); if(ps.length<2) return mErr('Cochez au moins deux biens, ou choisissez « Un bien ».'); const t=sum(ps,p=>p.part); if(Math.abs(t-100)>0.5) return mErr(`La répartition fait ${nf0.format(t)} % : ajustez les parts pour arriver à 100 %.`); }
      const file=f.elements.file.files[0];
      const teom=dep&&cat==='Taxes'?numv(f,'teom'):NaN;
      if(teom>montant) return mErr("La part ordures ménagères ne peut pas dépasser le montant de la taxe.");
      const rec = o.id ? o : {id:uid('o'), type};
      if(dep){ rec.teom = teom>0 ? teom : 0; const dv=val(f,'deductible'); rec.deductible = dv==='oui'?true:dv==='non'?false:null; }
      Object.assign(rec,{type, montant:Math.round(montant*100)/100, date:val(f,'date'), libelle:val(f,'libelle'), categorie:cat, repart:{mode:md,parts:ps}, fournisseur:val(f,'fournisseur'), statut:f.querySelector('input[name=statut]:checked').value, note:val(f,'note'), projetId:dep?val(f,'projetId'):''});
      if(file){ const btn=f.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Envoi du fichier…'; const up=await uploadFile(file); rec.justif={nom:file.name,url:up.url}; S.documents.push({id:uid('d'),nom:rec.libelle,categorie:dep?(cat==='Travaux'?'Travaux':cat==='Énergie'?'Énergie':cat==='Taxes'?'Taxes':'Autre'):'Autre',bienId:md==='un'?ps[0].id:'',date:rec.date,taille:file.size,url:up.url,ext:file.name.split('.').pop()}); }
      if(!o.id) S.operations.push(rec);
      save(); toast(isNew?(dep?'Dépense ajoutée':'Revenu ajouté'):'Modifications enregistrées'); return true;
    },
    onDelete: o.id ? ()=>confirmBox(`Supprimer « ${esc(o.libelle)} » (${eur(o.montant)}) ? Cette opération disparaîtra des totaux.`, 'Supprimer', ()=>{ S.operations=S.operations.filter(x=>x.id!==o.id); save(); toast('Opération supprimée'); }) : null
  });
  repUpdate();
}
function repUpdate(){
  const f=document.getElementById('mform'); if(!f||!f.elements.mode) return;
  const md=f.querySelector('input[name=mode]:checked')?.value;
  ['un','plus','global'].forEach(k=>{ const el=document.getElementById('rep-'+k); if(el) el.hidden = (k==='plus'?'plusieurs':k)!==md; });
  const m=numv(f,'montant')||0; let t=0;
  for(const b of S.biens){ const c=f.elements['rp-'+b.id]||document.getElementById('rp-'+b.id); const pi=f.elements['rpp-'+b.id]; const a=document.getElementById('rpa-'+b.id); if(!c||!pi) continue; pi.disabled=!c.checked; const p=c.checked?Number(pi.value)||0:0; t+=p; if(a) a.textContent=c.checked&&m?eur(m*p/100):''; }
  const s=document.getElementById('rep-sum'); if(s){ s.textContent=`Total : ${nf0.format(t)} %`; s.style.color=Math.abs(t-100)<=0.5?'var(--profond)':'var(--rouge)'; }
}
function repEqual(){
  const f=document.getElementById('mform'); const on=S.biens.filter(b=>document.getElementById('rp-'+b.id)?.checked); if(!on.length) return;
  const base=Math.floor(100/on.length); on.forEach((b,i)=>{ f.elements['rpp-'+b.id].value = i<on.length-1?base:100-base*(on.length-1); }); repUpdate();
}

function bienForm(b){
  const isNew=!b; b=b||{nom:'',type:'maison',statut:'loue',adresse:'',surface:'',locataire:'',loyer:'',jourLoyer:5,finBail:'',notes:''};
  openModal(isNew?'Nouveau bien':'Modifier le bien', `
    <div class="f"><label for="b-nom">Nom du bien</label><input class="in" id="b-nom" name="nom" value="${esc(b.nom)}" placeholder="Ex. : Appartement centre-ville" required></div>
    <div class="row2"><div class="f"><label for="b-type">Type</label><select class="in" id="b-type" name="type">${Object.entries(TYPES_BIEN).map(([k,l])=>`<option value="${k}" ${b.type===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="f"><label for="b-surf">Surface (m²)</label><input class="in" id="b-surf" name="surface" inputmode="decimal" value="${b.surface||''}"></div></div>
    <div class="f"><label for="b-adr">Adresse</label><input class="in" id="b-adr" name="adresse" value="${esc(b.adresse)}"></div>
    <div class="f"><span class="lab">Statut</span><div class="seg">${Object.entries(STATUTS_BIEN).map(([k,[l]])=>`<label><input type="radio" name="statut" value="${k}" ${b.statut===k?'checked':''}>${l}</label>`).join('')}</div><span class="hint">Changer le statut garde tout l'historique du bien.</span></div>
    <div id="b-loc" class="col" style="gap:14px" ${b.statut!=='loue'?'hidden':''}>
      <div class="row2"><div class="f"><label for="b-locn">Locataire</label><input class="in" id="b-locn" name="locataire" value="${esc(b.locataire)}"></div><div class="f"><label for="b-loyer">Loyer mensuel</label><div class="in-euro"><input class="in" id="b-loyer" name="loyer" inputmode="decimal" value="${b.loyer||''}"></div></div></div>
      <div class="row2"><div class="f"><label for="b-jour">Payé le (jour du mois)</label><input class="in" id="b-jour" name="jourLoyer" type="number" min="1" max="31" value="${b.jourLoyer||5}"></div><div class="f"><label for="b-fin">Fin du bail</label><input class="in" id="b-fin" name="finBail" type="date" value="${b.finBail||''}"></div></div>
    </div>
    <div class="f"><label for="b-photo">Photo du bien</label><input class="in" type="file" id="b-photo" name="photo" accept="image/*" style="padding:9px 12px"><span class="hint">Sinon, une illustration est utilisée.</span></div>
    <div class="f"><label for="b-notes">Notes</label><textarea class="in" id="b-notes" name="notes">${esc(b.notes)}</textarea></div>`, {
    onSubmit: async f=>{
      if(!val(f,'nom')) return mErr('Donnez un nom au bien.');
      const st=f.querySelector('input[name=statut]:checked').value;
      const loyer=numv(f,'loyer');
      if(st==='loue' && !(loyer>0)) return mErr('Indiquez le loyer mensuel du bien loué.');
      const rec=b.id?b:{id:uid('b'),historique:[]};
      if(b.id && b.statut!==st) rec.historique.push({date:TODAY,texte:`Statut : ${STATUTS_BIEN[b.statut][0]} → ${STATUTS_BIEN[st][0]}`});
      if(b.id && st==='loue' && b.loyer!==loyer && b.loyer) rec.historique.push({date:TODAY,texte:`Loyer : ${eur(b.loyer)} → ${eur(loyer)}`});
      Object.assign(rec,{nom:val(f,'nom'),type:val(f,'type'),surface:numv(f,'surface')||0,adresse:val(f,'adresse'),statut:st,locataire:st==='loue'?val(f,'locataire'):'',loyer:st==='loue'?loyer:0,jourLoyer:Number(val(f,'jourLoyer'))||5,finBail:st==='loue'?val(f,'finBail'):'',notes:val(f,'notes')});
      const file=f.elements.photo.files[0]; if(file){ const up=await uploadFile(file); if(up.url) rec.photo=up.url; }
      if(!b.id){ rec.historique.push({date:TODAY,texte:'Bien ajouté au carnet'}); S.biens.push(rec); }
      ensureRents(); save(); toast(isNew?'Bien ajouté':'Bien mis à jour'); if(isNew){ location.hash='bien-'+rec.id; } return true;
    },
    onDelete: b.id ? ()=>confirmBox(`Supprimer « ${esc(b.nom)} » ? Les opérations déjà saisies sont conservées dans les totaux, mais ne seront plus rattachées à ce bien.`, 'Supprimer le bien', ()=>{ S.biens=S.biens.filter(x=>x.id!==b.id); save(); location.hash='biens'; toast('Bien supprimé'); }) : null
  });
}

  openModal(isNew?'Nouvelle tâche':'Modifier la tâche', `
    <div class="f"><label for="t-t">Quoi faire ?</label><input class="in" id="t-t" name="titre" value="${esc(t.titre)}" placeholder="Ex. : Appeler l'assurance" required></div>
    <div class="row2"><div class="f"><label for="t-d">Pour quand ?</label><input class="in" id="t-d" type="date" name="echeance" value="${t.echeance}"></div>
    <div class="f"><label for="t-b">Bien concerné</label><select class="in" id="t-b" name="bienId"><option value="">Patrimoine global</option>${S.biens.map(b=>`<option value="${b.id}" ${t.bienId===b.id?'selected':''}>${esc(b.nom)}</option>`).join('')}</select></div></div>

    <div class="f"><span class="lab">Type</span><div class="seg"><label><input type="radio" name="type" value="tache" ${t.type!=='decision'?'checked':''}>Tâche</label><label><input type="radio" name="type" value="decision" ${t.type==='decision'?'checked':''}>Décision future</label></div></div></div>`, {
    onSubmit: f=>{ if(!val(f,'titre')) return mErr('Décrivez la tâche en quelques mots.'); if(f.querySelector('input[name=type]:checked').value==='decision'&&!val(f,'echeance')) return mErr('Une décision future a besoin d\'une date limite.');

function projetForm(p, preset={}){
  const isNew=!p; p=p||{nom:'',biens:preset.bien?[preset.bien]:[],budget:'',progression:0,statut:'a_venir',debut:TODAY,finPrevue:'',finReelle:'',fournisseurs:[],description:'',actions:[],photos:[]};
  openModal(isNew?'Nouveau projet de travaux':'Modifier le projet', `
    <div class="f"><label for="p-n">Nom du projet</label><input class="in" id="p-n" name="nom" value="${esc(p.nom)}" placeholder="Ex. : Rénovation de la salle de bain" required></div>
    <div class="f"><span class="lab">Bien(s) concerné(s)</span><div class="chips">${S.biens.map(b=>`<label><input type="checkbox" name="biens" value="${b.id}" ${p.biens.includes(b.id)?'checked':''}>${esc(b.nom)}</label>`).join('')}</div></div>
    <div class="row2"><div class="f"><label for="p-b">Budget prévu</label><div class="in-euro"><input class="in" id="p-b" name="budget" inputmode="decimal" value="${p.budget}"></div></div>
    <div class="f"><span class="lab">Statut</span><select class="in" name="statut" aria-label="Statut"><option value="a_venir" ${p.statut==='a_venir'?'selected':''}>À venir</option><option value="en_cours" ${p.statut==='en_cours'?'selected':''}>En cours</option><option value="termine" ${p.statut==='termine'?'selected':''}>Terminé</option></select></div></div>
    <div class="row2"><div class="f"><label for="p-d">Début</label><input class="in" type="date" id="p-d" name="debut" value="${p.debut}"></div><div class="f"><label for="p-f">Fin prévue</label><input class="in" type="date" id="p-f" name="finPrevue" value="${p.finPrevue}"></div></div>
    ${!isNew?`<div class="f"><label for="p-fr">Fin réelle</label><input class="in" type="date" id="p-fr" name="finReelle" value="${p.finReelle}"></div>`:''}
    <div class="f"><label for="p-a">Artisans</label><input class="in" id="p-a" name="fournisseurs" value="${esc(p.fournisseurs.join(', '))}" placeholder="Séparés par des virgules"></div>
    <div class="f"><label for="p-desc">Description</label><textarea class="in" id="p-desc" name="description">${esc(p.description)}</textarea></div>`, {
    onSubmit: f=>{ const bs=[...f.querySelectorAll('input[name=biens]:checked')].map(c=>c.value); const bud=numv(f,'budget');
      if(!val(f,'nom')) return mErr('Donnez un nom au projet.'); if(!bs.length) return mErr('Choisissez au moins un bien.'); if(!(bud>0)) return mErr('Indiquez un budget prévu, même approximatif.');
      const rec=p.id?p:{id:uid('p'),progression:0,actions:[],photos:[]};
      Object.assign(rec,{nom:val(f,'nom'),biens:bs,budget:bud,statut:val(f,'statut'),debut:val(f,'debut'),finPrevue:val(f,'finPrevue'),finReelle:f.elements.finReelle?val(f,'finReelle'):'',fournisseurs:val(f,'fournisseurs').split(',').map(s=>s.trim()).filter(Boolean),description:val(f,'description')});
      if(rec.statut==='termine') rec.progression=100;
      if(!p.id){ S.projets.push(rec); location.hash='projet-'+rec.id; } save(); toast(isNew?'Projet créé':'Projet mis à jour'); return true; },
    onDelete: p.id ? ()=>confirmBox(`Supprimer le projet « ${esc(p.nom)} » ? Les dépenses liées restent dans vos finances.`,'Supprimer',()=>{ S.projets=S.projets.filter(x=>x.id!==p.id); S.operations.forEach(o=>{if(o.projetId===p.id)o.projetId='';}); save(); location.hash='travaux'; }) : null
  });
}
function docForm(d, preset={}){
  const isNew=!d; d=d||{nom:'',categorie:preset.cat||'Contrat',bienId:preset.bien||'',date:TODAY};
  openModal(isNew?'Ajouter un document':'Modifier le document', `
    ${isNew?`<div class="f"><label for="d-file">Fichier</label><input class="in" type="file" id="d-file" name="file" style="padding:9px 12px" required></div>`:''}
    <div class="f"><label for="d-n">Nom</label><input class="in" id="d-n" name="nom" value="${esc(d.nom)}" placeholder="Pris du fichier si vide"></div>
    <div class="row2"><div class="f"><label for="d-c">Catégorie</label><select class="in" id="d-c" name="categorie">${DOC_CATS.map(c=>`<option ${d.categorie===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="f"><label for="d-b">Bien</label><select class="in" id="d-b" name="bienId"><option value="">Commun à tous</option>${S.biens.map(b=>`<option value="${b.id}" ${d.bienId===b.id?'selected':''}>${esc(b.nom)}</option>`).join('')}</select></div></div>
    <div class="f"><label for="d-d">Date du document</label><input class="in" type="date" id="d-d" name="date" value="${d.date}"></div>`, {
    submit:isNew?'Ajouter':'Enregistrer',
    onSubmit: async f=>{ const file=isNew?f.elements.file.files[0]:null; if(isNew&&!file) return mErr('Choisissez le fichier à ajouter.');
      const rec=d.id?d:{id:uid('d')}; Object.assign(rec,{nom:val(f,'nom')||(file?file.name.replace(/\.[^.]+$/,''):d.nom),categorie:val(f,'categorie'),bienId:val(f,'bienId'),date:val(f,'date')||TODAY});
      if(file){ const btn=f.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Envoi…'; const up=await uploadFile(file); Object.assign(rec,{url:up.url,taille:file.size,ext:file.name.split('.').pop()}); S.documents.push(rec); }
      save(); toast(isNew?'Document ajouté':'Document mis à jour'); return true; },
    onDelete: d.id ? ()=>confirmBox(`Retirer « ${esc(d.nom)} » des documents ?`,'Retirer',()=>{ S.documents=S.documents.filter(x=>x.id!==d.id); save(); }) : null
  });
}
function pretForm(l){
  const isNew=!l; l=l||{nom:'',type:'immobilier',banque:'',montant:'',mensualite:'',taux:'',debut:CUR_YM,fin:'',restant:'',utilise:'',jour:5};
  openModal(isNew?'Ajouter un prêt':'Mettre à jour le prêt', `
    <div class="row2"><div class="f"><label for="l-n">Nom</label><input class="in" id="l-n" name="nom" value="${esc(l.nom)}" required></div><div class="f"><label for="l-b">Banque</label><input class="in" id="l-b" name="banque" value="${esc(l.banque)}"></div></div>
    <div class="f"><span class="lab">Type</span><div class="seg"><label><input type="radio" name="type" value="immobilier" ${l.type!=='travaux'?'checked':''}>Immobilier</label><label><input type="radio" name="type" value="travaux" ${l.type==='travaux'?'checked':''}>Travaux</label></div></div>
    <div class="row2"><div class="f"><label for="l-m">Montant initial</label><div class="in-euro"><input class="in" id="l-m" name="montant" inputmode="decimal" value="${l.montant}"></div></div><div class="f"><label for="l-me">Mensualité</label><div class="in-euro"><input class="in" id="l-me" name="mensualite" inputmode="decimal" value="${l.mensualite}"></div></div></div>
    <div class="row2"><div class="f"><label for="l-r">Restant dû</label><div class="in-euro"><input class="in" id="l-r" name="restant" inputmode="decimal" value="${l.restant}"></div></div><div class="f"><label for="l-t">Taux (%)</label><input class="in" id="l-t" name="taux" inputmode="decimal" value="${String(l.taux).replace('.',',')}"></div></div>
    <div class="row2"><div class="f"><label for="l-d">Début</label><input class="in" type="month" id="l-d" name="debut" value="${l.debut}"></div><div class="f"><label for="l-f">Fin prévue</label><input class="in" type="month" id="l-f" name="fin" value="${l.fin}"></div></div>
    <div class="row2"><div class="f"><label for="l-j">Prélevé le (jour)</label><input class="in" type="number" min="1" max="28" id="l-j" name="jour" value="${l.jour||5}"></div><div class="f"><label for="l-u">Budget travaux déjà utilisé</label><div class="in-euro"><input class="in" id="l-u" name="utilise" inputmode="decimal" value="${l.utilise??''}"></div><span class="hint">Pour un prêt travaux uniquement</span></div></div>`, {
    onSubmit: f=>{ const m=numv(f,'montant'), me=numv(f,'mensualite'), r=numv(f,'restant');
      if(!val(f,'nom')) return mErr('Donnez un nom au prêt.'); if(!(m>0)||!(me>0)) return mErr('Le montant initial et la mensualité sont nécessaires.'); if(!val(f,'debut')||!val(f,'fin')) return mErr('Indiquez le mois de début et de fin.');
      const rec=l.id?l:{id:uid('l')}; const u=numv(f,'utilise');
      Object.assign(rec,{nom:val(f,'nom'),banque:val(f,'banque'),type:f.querySelector('input[name=type]:checked').value,montant:m,mensualite:me,restant:isNaN(r)?m:r,taux:numv(f,'taux')||0,debut:val(f,'debut'),fin:val(f,'fin'),jour:Number(val(f,'jour'))||5,utilise:isNaN(u)?null:u});
      if(!l.id) S.prets.push(rec); save(); toast('Prêt enregistré'); return true; },
    onDelete: l.id ? ()=>confirmBox(`Supprimer le prêt « ${esc(l.nom)} » ? Ses mensualités ne seront plus comptées.`,'Supprimer',()=>{ S.prets=S.prets.filter(x=>x.id!==l.id); save(); }) : null
  });
}
function scenForm(bId, s){
  const b=bien(bId); const isNew=!s; s=s||{titre:'',revenu:'',cout:'',delai:'',notes:'',favori:false};
  openModal(isNew?'Nouveau scénario':'Modifier le scénario', `
    <div class="f"><label for="s-t">Scénario</label><input class="in" id="s-t" name="titre" value="${esc(s.titre)}" placeholder="Ex. : Relouer en bureau" required></div>
    <div class="row2"><div class="f"><label for="s-r">Revenu par an</label><div class="in-euro"><input class="in" id="s-r" name="revenu" inputmode="decimal" value="${s.revenu||''}"></div></div><div class="f"><label for="s-c">Coût estimé</label><div class="in-euro"><input class="in" id="s-c" name="cout" inputmode="decimal" value="${s.cout||''}"></div></div></div>
    <div class="f"><label for="s-d">Délai</label><input class="in" id="s-d" name="delai" value="${esc(s.delai)}" placeholder="Ex. : 3 à 6 mois"></div>
    <div class="f"><label for="s-n">Notes, avantages, inconvénients</label><textarea class="in" id="s-n" name="notes">${esc(s.notes)}</textarea></div>`, {
    onSubmit: f=>{ if(!val(f,'titre')) return mErr('Donnez un nom au scénario.'); b.scenarios=b.scenarios||[]; const rec=s.id?s:{id:uid('s'),favori:false};
      Object.assign(rec,{titre:val(f,'titre'),revenu:numv(f,'revenu')||0,cout:numv(f,'cout')||0,delai:val(f,'delai'),notes:val(f,'notes')}); if(!s.id) b.scenarios.push(rec); save(); return true; },
    onDelete: s.id ? ()=>confirmBox(`Supprimer le scénario « ${esc(s.titre)} » ?`,'Supprimer',()=>{ b.scenarios=b.scenarios.filter(x=>x.id!==s.id); save(); }) : null
  });
}
function planForm(bId){
  const b=bien(bId); const p=b.plan||{titre:'',horizon:'',conditions:'',budget:'',etapes:[]};
  openModal(b.plan?'Modifier le projet':'Préparer un projet', `
    <div class="f"><label for="pl-t">Projet</label><input class="in" id="pl-t" name="titre" value="${esc(p.titre)}" placeholder="Ex. : Récupérer le logement pour la famille" required></div>
    <div class="row2"><div class="f"><label for="pl-h">Échéance visée</label><input class="in" id="pl-h" name="horizon" value="${esc(p.horizon)}" placeholder="Ex. : Été 2027"></div><div class="f"><label for="pl-b">Budget estimé</label><div class="in-euro"><input class="in" id="pl-b" name="budget" inputmode="decimal" value="${p.budget||''}"></div></div></div>
    <div class="f"><label for="pl-c">Conditions à réunir</label><textarea class="in" id="pl-c" name="conditions">${esc(p.conditions)}</textarea></div>`, {
    onSubmit: f=>{ if(!val(f,'titre')) return mErr('Décrivez le projet en une phrase.'); b.plan=Object.assign(p,{titre:val(f,'titre'),horizon:val(f,'horizon'),budget:numv(f,'budget')||0,conditions:val(f,'conditions')}); save(); return true; },
    onDelete: b.plan ? ()=>confirmBox('Supprimer ce projet et ses étapes ?','Supprimer',()=>{ delete b.plan; save(); }) : null
  });
}

async function uploadFile(file){
  if(SB){
    const path=`${new Date().getFullYear()}/${uid('f')}-${file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_')}`;
    const {error}=await SB.storage.from('justificatifs').upload(path, file, {contentType:file.type||undefined});
    if(error){ toast(/size|large/i.test(error.message)?'Fichier trop lourd pour être envoyé.':"Le fichier n'a pas pu être envoyé. L'entrée est gardée sans pièce jointe."); return {url:null}; }
    return {url:'sb:'+path};
  }
  await caps.ready;
  if(!caps.assets){ toast('Le fichier est noté, mais ne peut pas être stocké ici.'); return {url:null}; }
  try{ const r=await caps.assets.upload(file); return {url:r.url}; }
  catch(e){ toast(e&&e.code==='too_large'?'Fichier trop lourd (20 Mo maximum).':"Le fichier n'a pas pu être envoyé. L'entrée est gardée sans pièce jointe."); return {url:null}; }
}
let toastT;
function toast(t){ let el=document.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=t; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2800); }

/* ---------- Événements ---------- */
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-a]'); if(!a) return;
  const k=a.dataset.a, id=a.dataset.id;
  if(k==='close-bg'){ if(e.target===a) closeModal(); return; }
  if(a.tagName==='A' && k!=='go-tab') return;
  switch(k){
    case 'close': closeModal(); break;
    case 'm-del': window._mDel && window._mDel(); break;
    case 'add-menu': addMenu(); break;
    case 'new-op': closeModal(); opForm(a.dataset.type, null, {bien:a.dataset.bien, projet:a.dataset.projet, cat:a.dataset.cat}); break;
    case 'edit-op': { const o=S.operations.find(o=>o.id===id); if(o) opForm(o.type,o); break; }
    case 'pay': { const o=S.operations.find(o=>o.id===id); if(o){ o.statut='paye'; if(o.type==='revenu'&&o.date>TODAY) o.date=TODAY; save(); render(); toast(o.type==='revenu'?'Loyer marqué comme reçu':'Marqué comme payé'); } break; }
    case 'rep-equal': repEqual(); break;
    case 'new-bien': closeModal(); bienForm(); break;
    case 'edit-bien': bienForm(bien(id)); break;
    case 'bien-tab': UI.bienTab=a.dataset.tab; render(); break;
    case 'go-tab': UI.bienTab=a.dataset.tab; UI.keepTab=true; if(location.hash===a.getAttribute('href')) render(); break;
    case 'new-task': closeModal(); taskForm(); break;
    case 'edit-task': taskForm(S.taches.find(t=>t.id===id)); break;
    case 'toggle-task': { const t=S.taches.find(t=>t.id===id); if(t){ t.fait=!t.fait; save(); render(); if(t.fait) toast('Bravo, c\'est fait'); } break; }
    case 'toggle-done': UI.showDone=!UI.showDone; render(); break;
    case 'new-projet': closeModal(); projetForm(null,{bien:a.dataset.bien}); break;
    case 'edit-projet': projetForm(S.projets.find(p=>p.id===id)); break;
    case 'trav-filter': UI.travFilter=a.dataset.f; render(); break;
    case 'toggle-action': { const p=S.projets.find(p=>p.id===id); const x=p.actions.find(x=>x.id===a.dataset.e); x.fait=!x.fait; save(); render(); break; }
    case 'del-action': { const p=S.projets.find(p=>p.id===id); p.actions=p.actions.filter(x=>x.id!==a.dataset.e); save(); render(); break; }
    case 'new-doc': closeModal(); docForm(null,{bien:a.dataset.bien, cat:a.dataset.cat}); break;
    case 'edit-doc': docForm(S.documents.find(d=>d.id===id)); break;
    case 'doc-filter': UI.docBien=a.dataset.f; render(); break;
    case 'fin-tab': UI.finTab=a.dataset.tab; render(); break;
    case 'new-pret': pretForm(); break;
    case 'edit-pret': pretForm(S.prets.find(l=>l.id===id)); break;
    case 'new-scen': scenForm(id); break;
    case 'edit-scen': scenForm(id, bien(id).scenarios.find(s=>s.id===a.dataset.s)); break;
    case 'fav-scen': { const b=bien(id); b.scenarios.forEach(s=>s.favori = s.id===a.dataset.s ? !s.favori : false); save(); render(); break; }
    case 'edit-plan': planForm(id); break;
    case 'toggle-etape': { const e2=bien(id).plan.etapes.find(x=>x.id===a.dataset.e); e2.fait=!e2.fait; save(); render(); break; }
    case 'del-etape': { const pl=bien(id).plan; pl.etapes=pl.etapes.filter(x=>x.id!==a.dataset.e); save(); render(); break; }
    case 'fisc-settings': fiscForm(UI.fiscYear||fiscYearDefault()); break;
    case 'deduct': { const o=S.operations.find(o=>o.id===id); if(!o) break; const auto=DEDUCT_DEFAULT[o.categorie]??false; const cur=o.deductible==null?auto:o.deductible; o.deductible = (!cur)===auto ? null : !cur; save(); render(); break; }
    case 'fisc-task': { const t=a.dataset.t, d=a.dataset.d; if(S.taches.some(x=>x.titre===t&&!x.fait)){ toast('Déjà dans « À faire »'); break; } S.taches.push({id:uid('t'),titre:t,echeance:d,priorite:'normale',bienId:'',type:'tache',fait:false}); save(); render(); toast('Ajouté à « À faire »'); break; }
    case 'logout': (async()=>{ try{ await SB.auth.signOut(); }catch(e){} location.hash=''; location.reload(); })(); break;
    case 'reload': location.reload(); break;
    case 'reset': confirmBox("Effacer toutes les données d'exemple (opérations, tâches, projets, documents, scénarios) ? Vos biens restent pour que vous les complétiez.", "Tout effacer", ()=>{ S.operations=[]; S.taches=[]; S.projets=[]; S.documents=[]; S.biens.forEach(b=>{ delete b.scenarios; delete b.plan; b.historique=[]; }); ensureRents(); S.exemple=false; save(); toast('Carnet remis à zéro'); }); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('mform')) closeModal();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.op[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', async e=>{
  const f=e.target; e.preventDefault();
  if(f.id==='login-form'){ return sbLogin(f); }
  if(f.id==='mform'){ if(!modalSubmit) return; mErr(''); const ok=await modalSubmit(f); if(ok===true){ closeModal(); render(); } return; }
  if(f.dataset.f==='add-etape'){ const t=f.elements.t.value.trim(); if(!t) return; const b=bien(f.dataset.id); b.plan.etapes.push({id:uid('e'),titre:t,fait:false}); save(); render(); document.getElementById('etape-'+b.id)?.focus(); }
  if(f.dataset.f==='add-action'){ const t=f.elements.t.value.trim(); if(!t) return; const p=S.projets.find(p=>p.id===f.dataset.id); p.actions.push({id:uid('a'),titre:t,fait:false}); save(); render(); document.getElementById('act-'+p.id)?.focus(); }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.dataset.ch){ UI[t.dataset.ch]=t.value; render(); return; }
  if(t.dataset.in==='progression'){ const p=S.projets.find(p=>p.id===t.dataset.id); p.progression=Number(t.value); if(p.progression>0&&p.statut==='a_venir') p.statut='en_cours'; save(); render(); return; }
  if(t.dataset.up==='photo'){ const file=t.files[0]; if(!file) return; const up=await uploadFile(file); if(up.url){ S.projets.find(p=>p.id===t.dataset.id).photos.push(up.url); save(); render(); toast('Photo ajoutée'); } return; }
  if(t.closest('#mform')){
    if(t.name==='statut' && t.closest('#mform').elements.locataire!==undefined){ const box=document.getElementById('b-loc'); if(box) box.hidden=t.value!=='loue'; }
    if(t.name==='categorie'){ const tb=document.getElementById('teom-box'); if(tb) tb.hidden=t.value!=='Taxes'; }
    if(t.name==='mode' || t.name==='rp'){ if(t.name==='rp' && t.checked){ const f=t.closest('form'); if(!f.elements['rpp-'+t.value].value) setTimeout(repEqual,0);} repUpdate(); }
  }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.in==='docQ'){ UI.docQ=t.value; const q=t.value.trim().toLowerCase(); const f=UI.docBien; const list=S.documents.filter(d=>(f==='all'||(f==='commun'?!d.bienId:d.bienId===f))&&(!q||(d.nom+' '+d.categorie).toLowerCase().includes(q))); document.getElementById('doc-list').innerHTML=docList(list); return; }
  if(t.dataset.in==='progression'){ const v=document.getElementById('progv'); if(v) v.textContent=t.value+' %'; return; }
  if(t.closest('#mform') && (t.name==='montant' || t.name.startsWith('rpp-'))) repUpdate();
});

/* ---------- Démarrage ---------- */
let booting=false;
async function boot(){
  if(booting) return; booting=true;
  try{ const ok=await load(); if(ok!==false){ document.body.classList.remove('gated'); render(); } }
  catch(e){ if(SB) showGate('error', String(e&&e.message||e)); else { S=seed(); ensureFiscal(); render(); } }
  finally{ booting=false; }
}
if(SB) SB.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN' && !S) setTimeout(boot,0); });
boot();
</script>
