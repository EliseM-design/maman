<title>Maison & Patrimoine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : barre latérale vert sapin + carnet clair ; sur mobile, barre d'onglets en bas. Charte V1.0, look clair assumé. */
:root{
  --sapin:#183C32; --profond:#285548; --sauge:#789486; --beige:#E9E1D2; --blanc:#FAF9F5;
  --sable:#D8CCB8; --anthracite:#26302D; --rouge:#B85C52; --ocre:#C28A45;
  --surface:#FFFFFF; --muted:#5E6A65; --soft:#F3EFE7; --line:#E6DED0;
  --sauge-pale:#E4ECE7; --rouge-pale:#F6E5E2; --ocre-pale:#F7EBD9; --dep:#D9B486; --cred:#C9BCA6;
  --on-sapin:#F4F1EA; --on-sapin-muted:#AFC2B8;
  --f-titre:"Lora", Georgia, "Times New Roman", serif;
  --f-corps:"Manrope", "Aptos", "Segoe UI", system-ui, sans-serif;
  --r:12px; --r-sm:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--blanc);color:var(--anthracite);font-family:var(--f-corps);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-titre);font-weight:600;font-size:clamp(1.6rem,1.2rem + 1.4vw,2.1rem);color:var(--sapin);letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700;color:var(--sapin)}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px;border-radius:4px}

/* Structure */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--sapin);color:var(--on-sapin);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;gap:20px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;padding:4px 0 10px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand svg{width:40px;height:40px}
.brand b{font-family:var(--f-titre);font-weight:600;letter-spacing:.12em;font-size:.86rem;text-align:center;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;text-decoration:none;color:var(--on-sapin-muted);font-weight:600;font-size:.93rem}
.nav a:hover{background:rgba(255,255,255,.06);color:var(--on-sapin)}
.nav a.on{background:var(--profond);color:#fff}
.nav svg{width:19px;height:19px;flex:none}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--on-sapin-muted);display:flex;gap:10px;align-items:center;padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.1)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sauge);flex:none}
.dot.warn{background:var(--ocre)} .dot.err{background:var(--rouge)}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabbar{display:none}

/* En-têtes */
.head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:4px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.88rem;margin-bottom:6px}
.back svg{width:16px;height:16px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-p{background:var(--sapin);color:#fff}
.btn-p:hover{background:var(--profond)}
.btn-s{background:var(--surface);border-color:var(--sable);color:var(--sapin)}
.btn-s:hover{background:var(--soft)}
.btn-g{background:transparent;color:var(--sapin);padding:0 10px}
.btn-g:hover{background:var(--soft)}
.btn-d{background:var(--surface);border-color:#E2C3BE;color:var(--rouge)}
.btn-sm{min-height:34px;padding:0 12px;font-size:.84rem;border-radius:8px}
.link{background:none;border:0;padding:0;color:var(--profond);font-weight:700;cursor:pointer;text-decoration:none;font-size:.88rem;display:inline-flex;gap:4px;align-items:center}
.link svg{width:15px;height:15px}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:17px;height:17px}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(38,48,45,.04);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card.soft{background:var(--soft);box-shadow:none}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--sauge-pale);color:var(--sapin);flex:none}
.kpi .ic svg{width:20px;height:20px}
.kpi .ic.o{background:var(--ocre-pale);color:#8A5D26}
.kpi .ic.r{background:var(--rouge-pale);color:var(--rouge)}
.kpi .ic.n{background:var(--soft);color:var(--anthracite)}
.kpi .lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.big .u{font-size:.95rem;font-weight:700;margin-left:3px;color:var(--muted)}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.neg{color:var(--rouge)} .pos{color:var(--profond)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--anthracite);white-space:nowrap;line-height:1.4}
.badge svg{width:12px;height:12px}
.b-ok{background:var(--sauge-pale);color:var(--sapin)}
.b-warn{background:var(--ocre-pale);color:#7E521E}
.b-alert{background:var(--rouge-pale);color:#93443B}
.b-info{background:#E8EEF0;color:#2F4A55}
.b-res{background:var(--beige);color:var(--sapin)}

/* Barres de progression */
.bar{height:8px;background:var(--beige);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--profond);border-radius:99px}
.bar.o i{background:var(--ocre)} .bar.r i{background:var(--rouge)}

/* Biens */
.illu{display:block;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:var(--beige)}
.illu svg,.illu img{display:block;width:100%;height:100%;object-fit:cover}
.biens{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.bien{display:flex;flex-direction:column;gap:12px;padding:12px 12px 16px}
.bien .t{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bien .addr{color:var(--muted);font-size:.82rem}
.facts{display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.facts div{display:flex;align-items:center;gap:8px}
.facts svg{width:15px;height:15px;color:var(--sauge);flex:none}
.mini-biens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mini-bien{text-decoration:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini-bien b{font-size:.88rem}
.mini-bien span{font-size:.78rem;color:var(--muted)}
.mini-bien:hover b{text-decoration:underline}

/* Listes */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .ic{width:32px;height:32px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--profond);flex:none}
.li .ic svg{width:16px;height:16px}
.li .ic.o{background:var(--ocre-pale);color:#8A5D26} .li .ic.r{background:var(--rouge-pale);color:var(--rouge)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:.9rem;font-weight:600;overflow-wrap:anywhere}
.li .tx span{display:block;font-size:.78rem;color:var(--muted)}
.li .when{font-size:.8rem;font-weight:700;white-space:nowrap}
.when.late{color:var(--rouge)} .when.soon{color:#9A6726} .when.calm{color:var(--muted)}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--sable);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:#fff;padding:0}
.check svg{width:14px;height:14px}
.check.on{background:var(--profond);border-color:var(--profond)}
.done .tx b{text-decoration:line-through;color:var(--muted)}

/* Opérations */
.ops{display:flex;flex-direction:column}
.op{display:grid;grid-template-columns:96px minmax(0,1.6fr) minmax(0,1fr) 108px 112px;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.op:hover{background:var(--soft)}
.op.hd{cursor:default;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;border-top:0;padding-top:0}
.op.hd:hover{background:none}
.op .d{font-size:.84rem;color:var(--muted)}
.op .l b{display:block;font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.op .l span{font-size:.78rem;color:var(--muted)}
.op .w{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.op .m{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Onglets & filtres */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;font-size:.88rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab.on{color:var(--sapin);border-color:var(--sapin)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--sable);background:var(--surface);padding:6px 13px;border-radius:999px;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--muted)}
.pill.on{background:var(--sapin);border-color:var(--sapin);color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel{min-height:40px;border:1px solid var(--sable);border-radius:9px;background:var(--surface);padding:0 12px;font-weight:600;font-size:.88rem}

/* Graphiques */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.cat-l{display:flex;flex-direction:column;gap:7px;font-size:.84rem;min-width:0}
.cat-l div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.cat-l i{width:10px;height:10px;border-radius:3px}
.cat-l .p{color:var(--muted);font-size:.78rem;min-width:36px;text-align:right}
.hbars{display:flex;flex-direction:column;gap:10px;font-size:.85rem}
.hbars .r{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center}
.hbars .r span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* Projets */
.proj{display:flex;flex-direction:column;gap:12px;padding:12px 12px 16px}
.proj-n{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.8rem}
.proj-n span{display:block;color:var(--muted)}
.proj-n b{font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700}
.prog .bar{flex:1}
.stat3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat3>div{background:var(--soft);border-radius:10px;padding:12px 14px;min-width:0}
.stat3 span{font-size:.76rem;color:var(--muted);font-weight:600;display:block}
.stat3 b{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Détails */
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:.88rem}
.info dt{color:var(--muted)} .info dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.month{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:.78rem;display:flex;flex-direction:column;gap:4px;background:var(--surface);text-align:left;cursor:default}
.month b{font-size:.82rem}
.month.ok{background:var(--sauge-pale);border-color:transparent}
.month.warn{background:var(--ocre-pale);border-color:transparent;cursor:pointer}
.month.late{background:var(--rouge-pale);border-color:transparent;cursor:pointer}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.scen .card{display:flex;flex-direction:column;gap:10px}
.scen .card.fav{border-color:var(--profond);box-shadow:0 0 0 1px var(--profond)}
.note{background:var(--beige);border-radius:10px;padding:12px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;color:var(--sapin);margin-top:2px}
.note.ex{background:var(--sauge-pale)}

/* Formulaires / modale */
.modal-bg{position:fixed;inset:0;background:rgba(24,40,34,.42);display:grid;place-items:center;z-index:50;padding:16px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.modal{background:var(--blanc);border-radius:16px;width:min(620px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(24,40,34,.25)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-family:var(--f-titre);font-weight:600;font-size:1.3rem}
.modal-b{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lab{font-weight:700;font-size:.84rem}
.f .hint{font-size:.78rem;color:var(--muted)}
.in{min-height:44px;border:1px solid var(--sable);border-radius:10px;background:var(--surface);padding:0 12px;width:100%}
textarea.in{padding:10px 12px;min-height:80px;resize:vertical}
.in:focus{border-color:var(--profond);outline:none;box-shadow:0 0 0 3px var(--sauge-pale)}
.in-euro{position:relative}
.in-euro .in{padding-right:34px;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.in-euro::after{content:"€";position:absolute;right:13px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg label{flex:1;text-align:center;padding:8px 10px;border-radius:8px;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--muted);min-width:80px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--sapin);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{border:1px solid var(--sable);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;cursor:pointer;background:var(--surface)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--sapin);border-color:var(--sapin);color:#fff}
.chips label:has(input:focus-visible){outline:2px solid var(--ocre)}
.rep{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:10px;padding:12px}
.rep-row{display:grid;grid-template-columns:24px 1fr 90px 90px;gap:10px;align-items:center;font-size:.88rem}
.rep-row input[type=number]{min-height:36px;text-align:right}
.rep-row .amt{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rep-sum{font-size:.82rem;font-weight:700;text-align:right}
.err{color:var(--rouge);font-size:.82rem;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.choice:hover{border-color:var(--sauge)}
.choice .ic{width:38px;height:38px;border-radius:10px;background:var(--sauge-pale);display:grid;place-items:center;color:var(--sapin);flex:none}
.choice .ic svg{width:19px;height:19px}
.choice b{display:block;font-size:.92rem}
.choice span{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--anthracite);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:.88rem;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{padding-left:36px;min-height:40px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.doc-ic{width:34px;height:40px;border-radius:5px;background:var(--rouge-pale);color:var(--rouge);display:grid;place-items:center;font-size:.6rem;font-weight:800;flex:none}
.doc-ic.w{background:#E5ECF2;color:#3D5A73}
.doc-ic.i{background:var(--sauge-pale);color:var(--sapin)}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* Fiscalité & connexion */
.li.off{opacity:.55}
.li .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.9rem}
.li.total{border-top:2px solid var(--line);font-weight:800}
.gated .side,.gated .tabbar{display:none!important}
.gated .app{grid-template-columns:1fr}
.gate{max-width:460px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;gap:18px}
.gate .mark{width:56px;height:56px;border-radius:14px;background:var(--sapin);display:grid;place-items:center}
.gate .mark svg{width:34px;height:34px}
.fisc-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fisc-cmp>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.fisc-cmp>div.best{border-color:var(--profond);background:var(--sauge-pale)}
.fisc-cmp span{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.fisc-cmp b{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}

let saveTimer=null, saveState='idle';

caps.ready = (async () => {
  try{
    if(SB || !window.claude || typeof window.claude.use!=='function') return;
    const [a, s] = await Promise.all([window.claude.use('artifact').catch(()=>null), window.claude.use('assets').catch(()=>null)]);
    caps.artifact=a; caps.assets=s;
  }catch(e){}
  finally{ paintSave(); }
})();

function paintSave(){
  const el=document.getElementById('savestate'); if(!el) return;
  const m = {
    idle:[(caps.artifact||SB)?'':'warn', (caps.artifact||SB)?'Tout est enregistré':'Enregistré sur cet appareil'],
    pending:['warn','Enregistrement…'],
    ok:['','Tout est enregistré'],
    local:['warn','Enregistré sur cet appareil'],
    readonly:['warn','Consultation seule'],
    conflict:['warn','Mise à jour reçue, rechargement…'],
    error:['err',"Échec de l'enregistrement, réessayez"],
  }[saveState] || ['', ''];
  el.innerHTML=`<span class="dot ${m[0]}"></span><span>${m[1]}</span>`;
}
function setSave(s){ saveState=s; paintSave(); }
function save(){
  S.maj=new Date().toISOString();
  if(S.exemple===true) S.exemple='modifie';
  setSave('pending');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,1200);
}
async function doSave(){
  if(SB) return sbSave();
  const json=JSON.stringify(S);
  try{ localStorage.setItem(LS,json); }catch(e){}
  await caps.ready;
  if(caps.artifact && !caps.readOnly){
    try{
      await caps.artifact.publish({'data/state.json':{content:json, contentType:'application/json'}});
      setSave('ok'); return;
    }catch(e){
      const c=e&&e.code;
      if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'){ caps.readOnly=true; setSave('readonly'); toast('Vous consultez ce carnet en lecture seule : vos changements ne sont pas enregistrés.'); return; }
      if(c==='conflict'){ setSave('conflict'); return; }
      if(c==='rate_limited'){ saveTimer=setTimeout(doSave,8000); return; }
      if(c==='capability_disabled'||c==='capability_removed'){ caps.artifact=null; setSave('local'); return; }
      if(c==='upstream_error'){ saveTimer=setTimeout(doSave,2500+Math.random()*2000); setSave('pending'); return; }
      setSave('error'); return;
    }
  }
  setSave('local');
}

async function load(){
  if(SB) return sbLoad();
  let st=null;
  try{ const r=await fetch('data/state.json',{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(j && Array.isArray(j.biens)) st=j; } }catch(e){}
  if(!st){ try{ const raw=localStorage.getItem(LS); if(raw){ const j=JSON.parse(raw); if(j&&Array.isArray(j.biens)) st=j; } }catch(e){} }
  S = st || seed();
  ensureFiscal(); ensureRents();
}
function ensureFiscal(){
  if(!S.fiscal) S.fiscal={tmi:null, interets:{}, departement:''};
  if(!S.fiscal.interets) S.fiscal.interets={};
  if(!S.fiscal.departement){ const m=(S.biens[0]?.adresse||'').match(/\b(\d{2})\d{3}\b/); if(m) S.fiscal.departement=m[1]; }
}

/* ---------- Supabase (version Vercel) ---------- */
async function sbLoad(){
  const {data:{session}} = await SB.auth.getSession();
  if(!session){ showGate('login'); return false; }
  SBUSER = session.user.email;
  const mem = await SB.from('membres').select('email').limit(1);
  if(mem.error){ showGate('error', mem.error.message); return false; }
  if(!mem.data.length){ showGate('denied'); return false; }
  const r = await SB.from('carnet').select('data,version').eq('id',1).maybeSingle();
  if(r.error){ showGate('error', r.error.message); return false; }
  if(r.data){ S=r.data.data; sbVersion=r.data.version; }
  else {
    S=seed();
    const ins=await SB.from('carnet').insert({id:1, data:S, version:1});
    if(ins.error){ showGate('error', ins.error.message); return false; }
    sbVersion=1;
  }
  ensureFiscal(); ensureRents(); return true;
}
async function sbSave(){
  const next=sbVersion+1;
  const {data,error}=await SB.from('carnet').update({data:S, version:next}).eq('id',1).eq('version',sbVersion).select('version');
  if(error){
    if(/jwt|auth|token/i.test(error.message||'')){ setSave('error'); toast('Votre session a expiré : reconnectez-vous, puis refaites votre dernier changement.'); showGate('login'); return; }
    setSave('error'); saveTimer=setTimeout(doSave,5000); return;
  }
  if(!data || !data.length){
    const r=await SB.from('carnet').select('data,version').eq('id',1).maybeSingle();
    if(r.data){ S=r.data.data; sbVersion=r.data.version; ensureFiscal(); render(); }
    setSave('ok'); toast("Quelqu'un a modifié le carnet en même temps que vous. La version la plus récente est affichée : refaites votre dernier changement.");
    return;
  }
  sbVersion=data[0].version; setSave('ok');
}
async function sbRefresh(){
  if(!SB || !S || saveState==='pending' || document.getElementById('mform')) return;
  const r=await SB.from('carnet').select('data,version').eq('id',1).maybeSingle();
  if(r.data && r.data.version>sbVersion && saveState!=='pending' && !document.getElementById('mform')){
    S=r.data.data; sbVersion=r.data.version; ensureFiscal(); render(); toast('Le carnet a été mis à jour avec les derniers changements.');
  }
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sbRefresh().catch(()=>{}); });
async function hydrate(){
  if(!SB) return;
  const els=[...document.querySelectorAll('[data-sb-src],[data-sb-href]')];
  const need=[...new Set(els.map(e=>e.dataset.sbSrc||e.dataset.sbHref))].filter(p=>!signed[p]);
  if(need.length){
    try{ const {data}=await SB.storage.from('justificatifs').createSignedUrls(need, 3600); (data||[]).forEach(d=>{ if(d.signedUrl) signed[d.path]=d.signedUrl; }); setTimeout(()=>need.forEach(p=>delete signed[p]), 50*60*1000); }catch(e){}
  }
  els.forEach(e=>{ const p=e.dataset.sbSrc||e.dataset.sbHref; const u=signed[p]; if(!u) return; if(e.dataset.sbSrc) e.src=u; else e.href=u; });
}

async function sbLogin(f){

function ensureRents(){
  // Crée le loyer attendu du mois en cours pour chaque bien loué (statut « À recevoir »).
  let changed=false;
  for(const b of S.biens){
    if(b.statut!=='loue' || !(b.loyer>0)) continue;
    const has=S.operations.some(o=>o.type==='revenu'&&o.categorie==='Loyer'&&o.date.slice(0,7)===CUR_YM&&o.repart.parts.some(p=>p.id===b.id));
    if(!has){
      const [y,m]=CUR_YM.split('-').map(Number);
      const last=new Date(y,m,0).getDate();
      S.operations.push({id:uid('o'),type:'revenu',date:`${CUR_YM}-${pad(Math.min(b.jourLoyer||5,last))}`,montant:b.loyer,categorie:'Loyer',libelle:'Loyer '+MOIS_L[m-1],repart:{mode:'un',parts:[{id:b.id,part:100}]},fournisseur:b.locataire||'',statut:'a_payer',justif:null,note:'',projetId:''});
      changed=true;
    }
  }
  if(changed && S.maj) save();
}

/* ---------- Calculs ---------- */
const bien = id => S.biens.find(b=>b.id===id);
const bienNom = id => id==='commun' ? 'Patrimoine global' : (bien(id)?.nom || 'Bien supprimé');
const parts = o => o.repart.mode==='global' ? [{id:'commun',part:100}] : o.repart.parts;
const partFor = (o, id) => { if(id==='all') return o.montant; const p=parts(o).find(p=>p.id===id); return p ? o.montant*p.part/100 : 0; };
const opBiensLabel = o => o.repart.mode==='global' ? 'Patrimoine global' : o.repart.parts.map(p=>bienNom(p.id)+(o.repart.parts.length>1?` (${nf0.format(p.part)} %)`:'')).join(' + ');
const statusLbl = (o) => o.statut==='paye' ? (o.type==='revenu'?['Reçu','b-ok','check']:['Payé','b-ok','check']) : o.statut==='a_payer' ? (o.type==='revenu'?['À recevoir','b-warn','clock']:['À payer','b-warn','clock']) : ['Prévu','b-info','cal'];
const badge = ([t,c,i]) => `<span class="badge ${c}">${ic(i)}${esc(t)}</span>`;
const bienBadge = b => badge(STATUTS_BIEN[b.statut]||STATUTS_BIEN.vacant);
function loanActive(l, ym){ return l.debut<=ym && ym<=l.fin; }
function credits(ym){ return sum(S.prets.filter(l=>loanActive(l,ym)), l=>l.mensualite); }
function opsIn(filter){ return S.operations.filter(filter); }
function monthTotals(ym, bienId='all'){
  const inM = o => o.date.slice(0,7)===ym && o.statut!=='prevu';
  const rev = sum(opsIn(o=>o.type==='revenu'&&inM(o)), o=>partFor(o,bienId));
  const dep = sum(opsIn(o=>o.type==='depense'&&inM(o)), o=>partFor(o,bienId));
  const cred = bienId==='all' ? credits(ym) : 0;
  return {rev, dep, cred, net:rev-dep-cred};
}
function periodOps(year, month, bienId){
  return S.operations.filter(o=>o.date.slice(0,4)===String(year) && (month==='all'||o.date.slice(5,7)===month) && (bienId==='all'||parts(o).some(p=>p.id===bienId)));
}
function projetTotals(p){
  const ops=S.operations.filter(o=>o.projetId===p.id && o.type==='depense');
  const paye=sum(ops.filter(o=>o.statut==='paye'),o=>o.montant);
  const engage=sum(ops,o=>o.montant);
  return {paye, engage, reste:p.budget-engage, ops};
}
function nextLoanDate(l){
  let [y,m]=TODAY.split('-').map(Number); const d=Number(TODAY.slice(8));
  if(d>(l.jour||5)){ m++; if(m>12){m=1;y++;} }
  return `${y}-${pad(m)}-${pad(l.jour||5)}`;
}
function bienYear(id, year){
  const ops=S.operations.filter(o=>o.date.slice(0,4)===String(year)&&o.statut!=='prevu'&&parts(o).some(p=>p.id===id));
  const rev=sum(ops.filter(o=>o.type==='revenu'),o=>partFor(o,id));
  const dep=sum(ops.filter(o=>o.type==='depense'),o=>partFor(o,id));
  return {rev,dep,net:rev-dep};
}
function todoItems(){
  // Paiements, loyers attendus et tâches, triés par urgence
  const items=[];
  for(const o of S.operations.filter(o=>o.statut==='a_payer')){
    if(o.type==='revenu' && days(o.date)>3) continue;
    items.push({kind:'op', id:o.id, date:o.date, titre:(o.type==='revenu'?'Recevoir : ':'Payer : ')+o.libelle+' — '+eur(o.montant), sous:opBiensLabel(o), icon:o.type==='revenu'?'in':'euro', tone:'o'});
  }
  for(const t of S.taches.filter(t=>!t.fait && t.type!=='decision')){
    items.push({kind:'tache', id:t.id, date:t.echeance||'2999-12-31', titre:t.titre, sous:t.bienId?bienNom(t.bienId):'Patrimoine global', icon:'checksq', tone:t.priorite==='haute'?'r':''});
  }
  return items.sort((a,b)=>a.date.localeCompare(b.date));
}
function watchItems(){
  const items=[];
  for(const l of S.prets){ const d=nextLoanDate(l); if(days(d)<=20 && loanActive(l,d.slice(0,7))) items.push({date:d, titre:`Prélèvement ${l.nom.toLowerCase()} — ${eur(l.mensualite)}`, sous:l.banque, icon:'bank', href:'#prets'}); }
  for(const b of S.biens){ if(b.finBail && days(b.finBail)<=365 && days(b.finBail)>=0) items.push({date:b.finBail, titre:`Fin du bail : ${b.nom}`, sous:b.locataire, icon:'key', href:'#bien-'+b.id}); }
  for(const t of S.taches.filter(t=>!t.fait&&t.type==='decision')) items.push({date:t.echeance, titre:t.titre, sous:'Décision à prendre', icon:'idea', href:t.bienId?'#bien-'+t.bienId:'#a-faire', tab:'avenir'});
  for(const d of fiscDeadlines()){ const n=days(d.date); if(n>=0&&n<=45) items.push({date:d.date, titre:d.titre, sous:'Fiscalité', icon:'receipt', href:'#fiscalite'}); }
  for(const p of S.projets){ const t=projetTotals(p); if(t.reste<0) items.push({date:TODAY, titre:`Budget dépassé : ${p.nom}`, sous:`${eur(-t.reste)} au-delà du prévu`, icon:'alert', href:'#projet-'+p.id}); }
  return items.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- Composants ---------- */
function opRows(list, bienId='all', opts={}){
  if(!list.length) return `<div class="empty">${ic('wallet')}<span>${opts.empty||'Aucune opération sur cette période.'}</span></div>`;
  const rows=list.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,opts.limit||9999).map(o=>{
    const amt=partFor(o,bienId); const sign=o.type==='revenu'?1:-1;
    return `<div class="op" data-a="edit-op" data-id="${o.id}" role="button" tabindex="0">
      <span class="d num">${dShort(o.date)}</span>
      <span class="l"><b>${esc(o.libelle)}</b><span>${esc(o.categorie)}${o.fournisseur?' · '+esc(o.fournisseur):''}${o.justif?' · justificatif':''}</span></span>
      <span class="w">${esc(opBiensLabel(o))}</span>
      <span class="s">${badge(statusLbl(o))}</span>
      <span class="m ${sign>0?'pos':''}">${sign>0?'+ ':'− '}${eur(Math.abs(amt)).replace('− ','')}</span></div>`;
  }).join('');
  return `<div class="ops"><div class="op hd"><span>Date</span><span>Libellé</span><span>Bien</span><span>Statut</span><span style="text-align:right">Montant</span></div>${rows}</div>`;
}
function monthChart(year, bienId='all', h=230){
  const data=Array.from({length:12},(_,i)=>monthTotals(`${year}-${pad(i+1)}`,bienId));
  const withCred = bienId==='all';
  const vals=data.flatMap(d=>[d.rev,d.dep,d.cred]); const nets=data.map(d=>d.net);
  const hi=Math.max(...vals,1), lo=Math.min(0,...nets); const step=niceMax((hi-lo)/4);
  const max=Math.ceil(hi/step)*step; const min=Math.floor(lo/step)*step;
  const W=720, ml=58, mr=10, mt=10, mb=28, H=h; const ih=H-mt-mb, iw=W-ml-mr;
  const y=v=>mt+ih*(max-v)/(max-min); const gw=iw/12; const nb=withCred?3:2; const bw=Math.min(14,gw*0.8/nb);
  let g='';
  const ticks=[]; for(let v=min; v<=max+1e-6; v+=step) ticks.push(v);
  for(const t of ticks){ g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'#C9BCA6':'#ECE5D8'}" stroke-width="1"/><text x="${ml-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#5E6A65">${nf0.format(Math.round(t))} €</text>`; }
  const cols=[['rev','#285548'],['dep','#D9B486'],['cred','#C9BCA6']].slice(0,nb);
  data.forEach((d,i)=>{
    const cx=ml+gw*i+gw/2; const x0=cx-bw*nb/2;
    const future = `${year}-${pad(i+1)}` > CUR_YM;
    cols.forEach(([k,c],j)=>{ const v=d[k]; if(v<=0) return; g+=`<rect x="${x0+j*bw}" y="${y(v)}" width="${bw-1.5}" height="${Math.max(1,y(0)-y(v))}" rx="2" fill="${c}" opacity="${future?.45:1}"><title>${MOIS_L[i]} : ${eur(v)}</title></rect>`; });
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${`${year}-${pad(i+1)}`===CUR_YM?'#183C32':'#5E6A65'}" font-weight="${`${year}-${pad(i+1)}`===CUR_YM?700:400}">${MOIS[i].replace('.','')}</text>`;
  });
  const pts=data.map((d,i)=>[ml+gw*i+gw/2, y(d.net), d]).filter((p,i)=>`${year}-${pad(i+1)}`<=CUR_YM && (p[2].rev||p[2].dep||p[2].cred));
  if(pts.length>1) g+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="#26302D" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  pts.forEach(p=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${p[2].net<0?'#B85C52':'#26302D'}"><title>Résultat : ${eur(p[2].net)}</title></circle>`; });
  const legend=`<div class="legend"><span><i style="background:#285548"></i>Revenus</span><span><i style="background:#D9B486"></i>Dépenses</span>${withCred?'<span><i style="background:#C9BCA6"></i>Crédits</span>':''}<span><i style="background:#26302D;height:2px;border-radius:0;vertical-align:3px"></i>Résultat</span></div>`;
  return `${legend}<div class="chart" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution mensuelle ${year}">${g}</svg></div>`;
}
function niceMax(v){ if(v<=0) return 100; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=4?4:n<=5?5:n<=8?8:10; return m*p; }
function donut(byCat){
  const tot=sum(Object.values(byCat)); if(!tot) return `<div class="empty">${ic('wallet')}<span>Pas encore de dépense sur cette période.</span></div>`;
  const ents=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const r=56, C=2*Math.PI*r; let off=0;
  const arcs=ents.map(([k,v])=>{ const len=C*v/tot; const s=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${CAT_COL[k]||'#D8CCB8'}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"><title>${esc(k)} : ${eur(v)}</title></circle>`; off+=len; return s; }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Répartition des dépenses">${arcs}<text x="75" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#26302D">${nf0.format(Math.round(tot))} €</text><text x="75" y="92" text-anchor="middle" font-size="10.5" fill="#5E6A65">au total</text></svg>
  <div class="cat-l">${ents.map(([k,v])=>`<div><i style="background:${CAT_COL[k]||'#D8CCB8'}"></i><span>${esc(k)}</span><b class="num">${eur(v,false)}</b><span class="p num">${Math.round(v/tot*100)} %</span></div>`).join('')}</div></div>`;
}
function progress(pct, cls=''){ pct=Math.max(0,Math.min(100,pct)); return `<div class="bar ${cls}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`; }
function exampleNote(){ return S.exemple ? `<div class="note ex">${ic('idea')}<div><b>Ce sont des données d'exemple.</b> Modifiez-les directement ou repartez de zéro depuis <a href="#plus" class="link">Plus › Mes données</a>.</div></div>` : ''; }

/* ---------- Vues ---------- */
function vAccueil(){
  const d=new Date(); const t=monthTotals(CUR_YM);
  const loues=S.biens.filter(b=>b.statut==='loue');
  const loyersM=S.operations.filter(o=>o.type==='revenu'&&o.categorie==='Loyer'&&o.date.slice(0,7)===CUR_YM);
  const recus=loyersM.filter(o=>o.statut==='paye').length;
  const depAPayer=sum(S.operations.filter(o=>o.type==='depense'&&o.statut==='a_payer'&&o.date.slice(0,7)===CUR_YM),o=>o.montant);
  const todo=todoItems().slice(0,5); const watch=watchItems().slice(0,4);
  const projets=S.projets.filter(p=>p.statut==='en_cours');
  const catYear={}; S.operations.filter(o=>o.type==='depense'&&o.statut!=='prevu'&&o.date.slice(0,4)===CUR_YM.slice(0,4)).forEach(o=>catYear[o.categorie]=(catYear[o.categorie]||0)+o.montant);
  const dateLong=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `
  <div class="head"><div><h1>Bonjour !</h1><p class="sub">${dateLong.charAt(0).toUpperCase()+dateLong.slice(1)} · ${S.biens.length} biens, ${loues.length} loyers actifs</p></div>
    <div class="head-actions"><button class="btn btn-p" data-a="add-menu">${ic('plus')}Ajouter</button></div></div>
  ${exampleNote()}
  <section class="kpis" aria-label="Ce mois-ci">
    ${kpi('in','',`Revenus de ${MOIS_L[d.getMonth()]}`, eurBig(t.rev), `${recus} loyer${recus>1?'s':''} reçu${recus>1?'s':''} sur ${loyersM.length}`)}
    ${kpi('out','o','Dépenses du mois', eurBig(t.dep), depAPayer?`dont ${eur(depAPayer)} à payer`:'Tout est réglé')}
    ${kpi('bank','n','Crédits du mois', eurBig(t.cred), `${S.prets.filter(l=>loanActive(l,CUR_YM)).length} prêts en cours`)}
    ${kpi('scale',t.net<0?'r':'','Résultat du mois', `<span class="${t.net<0?'neg':'pos'}">${eurBig(t.net,true)}</span>`, t.net<0?'Plus de sorties que d\'entrées':'Le mois est positif')}
  </section>
  <div class="dash">
    <div class="col">
      <section class="card"><div class="card-h"><h2>Mes biens</h2><a class="link" href="#biens">Voir les biens ${ic('arrow')}</a></div>
        <div class="mini-biens">${S.biens.map(b=>`<a class="mini-bien" href="#bien-${b.id}"><span class="illu">${bImg(b)}</span><b>${esc(b.nom)}</b><span>${b.statut==='loue'?'Loué · '+eur(b.loyer)+'/mois':STATUTS_BIEN[b.statut][0]}</span></a>`).join('')}</div></section>
      <section class="card"><div class="card-h"><h2>Finances ${CUR_YM.slice(0,4)}</h2><a class="link" href="#finances">Détail ${ic('arrow')}</a></div>
        ${monthChart(CUR_YM.slice(0,4),'all',210)}
        <div style="margin-top:18px">${donut(catYear)}</div></section>
    </div>
    <div class="col">
      <section class="card"><div class="card-h"><h2>Travaux en cours</h2><a class="link" href="#travaux">Tous ${ic('arrow')}</a></div>
        ${projets.length?`<div class="list">${projets.map(p=>{const tt=projetTotals(p);return `<a class="li" href="#projet-${p.id}" style="text-decoration:none"><span class="ic">${ic('tools')}</span><span class="tx"><b>${esc(p.nom)}</b><span>${eur(tt.paye)} dépensés sur ${eur(p.budget)}</span>${progress(p.progression)}</span><span class="when calm num">${p.progression} %</span></a>`;}).join('')}</div>`:`<div class="empty">Aucun chantier en cours.</div>`}</section>
      <section class="card"><div class="card-h"><h2>À faire</h2><a class="link" href="#a-faire">Tout voir ${ic('arrow')}</a></div>
        ${todo.length?`<div class="list">${todo.map(todoLi).join('')}</div>`:`<div class="empty">${ic('check')}<span>Rien d'urgent. Tout est à jour.</span></div>`}</section>
      <section class="card"><div class="card-h"><h2>À surveiller</h2></div>
        ${watch.length?`<div class="list">${watch.map(w=>{const [txt,cl]=rel(w.date);return `<a class="li" href="${w.href}" ${w.tab?`data-a="go-tab" data-tab="${w.tab}"`:''} style="text-decoration:none"><span class="ic">${ic(w.icon)}</span><span class="tx"><b>${esc(w.titre)}</b><span>${esc(w.sous||'')}</span></span><span class="when ${cl==='late'?'soon':'calm'}">${txt}</span></a>`;}).join('')}</div>`:`<div class="empty">Rien à signaler.</div>`}</section>
    </div>
  </div>`;
}
function kpi(i,cls,lbl,val,sub){ return `<div class="kpi"><span class="ic ${cls}">${ic(i)}</span><div style="min-width:0"><div class="lbl">${lbl}</div><div class="big">${val}</div><div class="s">${sub}</div></div></div>`; }
function bImg(b){ return b.photo ? `<img ${srcAttr(b.photo)} alt="">` : illu(b.type); }
function todoLi(it){
  const [txt,cl]=rel(it.date);
  const act = it.kind==='op' ? `<button class="btn btn-s btn-sm" data-a="pay" data-id="${it.id}">${it.icon==='in'?'Reçu':'Payé'}</button>` : `<button class="check" data-a="toggle-task" data-id="${it.id}" aria-label="Marquer comme fait"></button>`;
  return `<div class="li">${it.kind==='tache'?act:`<span class="ic ${it.tone}">${ic(it.icon)}</span>`}<span class="tx" ${it.kind==='tache'?`data-a="edit-task" data-id="${it.id}" style="cursor:pointer"`:`data-a="edit-op" data-id="${it.id}" style="cursor:pointer"`}><b>${esc(it.titre)}</b><span>${esc(it.sous)}</span></span><span class="when ${cl}">${it.date.startsWith('2999')?'':txt}</span>${it.kind==='op'?act:''}</div>`;
}

function vBiens(){
  const y=CUR_YM.slice(0,4);
  return `<div class="head"><div><h1>Mes biens</h1><p class="sub">${S.biens.length} biens au total</p></div><div class="head-actions"><button class="btn btn-p" data-a="new-bien">${ic('plus')}Ajouter un bien</button></div></div>
  <div class="biens">${S.biens.map(b=>{
    const yy=bienYear(b.id,y); const pr=S.projets.filter(p=>p.biens.includes(b.id)&&p.statut==='en_cours').length;
    const alerts=S.operations.filter(o=>o.statut==='a_payer'&&parts(o).some(p=>p.id===b.id)).length;
    return `<article class="card bien"><a href="#bien-${b.id}" class="illu" aria-label="${esc(b.nom)}">${bImg(b)}</a>
    <div class="t"><h3>${esc(b.nom)}</h3>${bienBadge(b)}</div>
    <p class="addr">${esc(b.adresse)}</p>
    <div class="facts">
      ${b.statut==='loue'?`<div>${ic('euro')}Loyer : <b class="num">${eur(b.loyer)}/mois</b></div><div>${ic('user')}Locataire : ${esc(b.locataire||'—')}</div>`:`<div>${ic('home')}${b.statut==='residence'?'Résidence principale · 0 € de loyer':STATUTS_BIEN[b.statut][0]}</div>`}
      <div>${ic('ruler')}Surface : ${b.surface?nf0.format(b.surface)+' m²':'—'}</div>
      <div>${ic('out')}Dépenses ${y} : <b class="num">${eur(yy.dep)}</b></div>
      ${pr||alerts?`<div>${ic('alert')}${[pr?pr+' chantier'+(pr>1?'s':'')+' en cours':'', alerts?alerts+' paiement'+(alerts>1?'s':'')+' en attente':''].filter(Boolean).join(' · ')}</div>`:''}
    </div>
    <a class="btn btn-p" href="#bien-${b.id}" style="margin-top:auto">Voir le bien ${ic('arrow')}</a></article>`;}).join('')}</div>`;
}

function vBien(id){
  const b=bien(id); if(!b) return `<a class="back" href="#biens">${ic('back')}Retour aux biens</a><div class="empty">Ce bien n'existe plus.</div>`;
  const y=CUR_YM.slice(0,4); const yy=bienYear(id,y);
  const tabs=[['apercu',"Vue d'ensemble"],['finances','Finances'],['locataire',b.statut==='residence'?'Occupation':'Locataire'],['travaux','Travaux'],['documents','Documents'],['avenir','Avenir'],['historique','Historique']];
  const ops=S.operations.filter(o=>parts(o).some(p=>p.id===id));
  const projs=S.projets.filter(p=>p.biens.includes(id)); const docs=S.documents.filter(d=>d.bienId===id);
  let body='';
  if(UI.bienTab==='apercu'){
    body=`<div class="split">
      <div class="card"><div style="display:grid;grid-template-columns:minmax(0,1fr);gap:16px"><span class="illu">${bImg(b)}</span>
        <div><div class="card-h" style="margin-bottom:10px"><h2>Informations</h2><button class="btn btn-g btn-sm" data-a="edit-bien" data-id="${id}">${ic('edit')}Modifier</button></div>
        <dl class="info"><dt>Type</dt><dd>${TYPES_BIEN[b.type]||b.type}</dd><dt>Surface</dt><dd>${b.surface?nf0.format(b.surface)+' m²':'—'}</dd><dt>Statut</dt><dd>${STATUTS_BIEN[b.statut][0]}</dd>
        ${b.statut==='loue'?`<dt>Locataire</dt><dd>${esc(b.locataire||'—')}</dd><dt>Loyer</dt><dd class="num">${eur(b.loyer)}/mois, le ${b.jourLoyer}</dd><dt>Fin du bail</dt><dd>${b.finBail?dFR(b.finBail):'—'}</dd>`:''}
        ${b.notes?`<dt>Notes</dt><dd style="font-weight:500">${esc(b.notes)}</dd>`:''}</dl></div></div></div>
      <div class="col">
        <div class="card"><div class="card-h"><h2>Finances ${y}</h2></div>
          <div class="stat3" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><span>Revenus</span><b class="pos">${eur(yy.rev)}</b></div><div><span>Dépenses</span><b>${eur(yy.dep)}</b></div><div><span>Net</span><b class="${yy.net<0?'neg':'pos'}">${eur(yy.net)}</b></div></div>
          <div style="margin-top:14px">${monthChart(y,id,170)}</div></div>
        <div class="grid g2">
          <button class="card choice" data-a="bien-tab" data-tab="travaux"><span class="ic">${ic('tools')}</span><span><b>Travaux</b><span>${projs.length} projet${projs.length>1?'s':''}</span></span></button>
          <button class="card choice" data-a="bien-tab" data-tab="documents"><span class="ic">${ic('file')}</span><span><b>Documents</b><span>${docs.length} document${docs.length>1?'s':''}</span></span></button>
        </div>
      </div></div>
      <section class="card"><div class="card-h"><h2>Dernières opérations</h2><button class="link" data-a="bien-tab" data-tab="finances">Tout voir ${ic('arrow')}</button></div>${opRows(ops.filter(o=>o.statut!=='prevu'),id,{limit:5})}</section>`;
  } else if(UI.bienTab==='finances'){
    body=`<section class="card"><div class="card-h"><h2>Toutes les opérations</h2><span class="small muted">Montants indiqués pour la part de ce bien</span></div>${opRows(ops,id,{empty:'Aucune opération pour ce bien.'})}</section>`;
  } else if(UI.bienTab==='locataire'){
    if(b.statut!=='loue') body=`<div class="card"><div class="empty">${ic('home')}<span>${b.statut==='residence'?'Ce bien est la résidence de la famille : il ne génère pas de loyer.':'Ce bien n\'est pas loué actuellement.'}</span><button class="btn btn-s" data-a="edit-bien" data-id="${id}">${ic('edit')}Changer le statut</button></div></div>`;
    else {
      const months=Array.from({length:12},(_,i)=>{const ym=`${y}-${pad(i+1)}`; const o=S.operations.find(o=>o.type==='revenu'&&o.categorie==='Loyer'&&o.date.slice(0,7)===ym&&o.repart.parts.some(p=>p.id===id)); return {ym,i,o};});
      body=`<div class="split"><div class="card"><h2 style="margin-bottom:12px">Locataire</h2><dl class="info"><dt>Nom</dt><dd>${esc(b.locataire||'—')}</dd><dt>Loyer</dt><dd class="num">${eur(b.loyer)} par mois</dd><dt>Payé le</dt><dd>${b.jourLoyer} du mois</dd><dt>Fin du bail</dt><dd>${b.finBail?dFR(b.finBail)+' ('+rel(b.finBail)[0].toLowerCase()+')':'—'}</dd></dl><div style="margin-top:14px"><button class="btn btn-s btn-sm" data-a="edit-bien" data-id="${id}">${ic('edit')}Modifier</button></div></div>
      <div class="card"><div class="card-h"><h2>Loyers ${y}</h2><span class="small muted">Touchez un mois en attente pour le marquer reçu</span></div><div class="months">${months.map(({ym,i,o})=>{
        if(!o) return `<div class="month"><b>${MOIS[i]}</b><span class="muted">${ym>CUR_YM?'À venir':'—'}</span></div>`;
        if(o.statut==='paye') return `<div class="month ok"><b>${MOIS[i]}</b><span>${ic('check').replace('<svg','<svg width="12" height="12"')} Reçu</span></div>`;
        const late=days(o.date)<0; return `<button class="month ${late?'late':'warn'}" data-a="pay" data-id="${o.id}"><b>${MOIS[i]}</b><span>${late?'En retard':'À recevoir'}</span></button>`;}).join('')}</div></div></div>`;
    }
  } else if(UI.bienTab==='travaux'){
    body=projs.length?`<div class="biens">${projs.map(projCard).join('')}</div>`:`<div class="card"><div class="empty">${ic('tools')}<span>Aucun projet de travaux pour ce bien.</span><button class="btn btn-s" data-a="new-projet" data-bien="${id}">${ic('plus')}Nouveau projet</button></div></div>`;
  } else if(UI.bienTab==='documents'){
    body=`<section class="card"><div class="card-h"><h2>Documents du bien</h2><button class="btn btn-s btn-sm" data-a="new-doc" data-bien="${id}">${ic('upload')}Ajouter</button></div>${docList(docs)}</section>`;
  } else if(UI.bienTab==='avenir'){
    body=vAvenir(b);
  } else {
    const ev=[...b.historique.map(h=>({date:h.date,t:h.texte,i:'history'})), ...ops.filter(o=>o.statut==='paye').map(o=>({date:o.date,t:(o.type==='revenu'?'Reçu : ':'Payé : ')+o.libelle+' — '+eur(partFor(o,id)),i:o.type==='revenu'?'in':'out'})), ...docs.map(d=>({date:d.date,t:'Document ajouté : '+d.nom,i:'file'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
    body=`<section class="card"><h2 style="margin-bottom:8px">Historique</h2><div class="list">${ev.map(e=>`<div class="li"><span class="ic">${ic(e.i)}</span><span class="tx"><b>${esc(e.t)}</b><span>${dFR(e.date)}</span></span></div>`).join('')||'<div class="empty">Rien pour le moment.</div>'}</div></section>`;
  }
  return `<div><a class="back" href="#biens">${ic('back')}Retour aux biens</a>
  <div class="head"><div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h1>${esc(b.nom)}</h1>${bienBadge(b)}</div><p class="sub">${esc(b.adresse)}</p></div>
  <div class="head-actions"><button class="btn btn-s" data-a="edit-bien" data-id="${id}">${ic('edit')}Modifier</button><button class="btn btn-p" data-a="new-op" data-type="depense" data-bien="${id}">${ic('plus')}Ajouter une dépense</button></div></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${UI.bienTab===k?'on':''}" role="tab" aria-selected="${UI.bienTab===k}" data-a="bien-tab" data-tab="${k}">${l}</button>`).join('')}</div>
  ${body}`;
}
function vAvenir(b){
  const id=b.id; const pl=b.plan; const sc=b.scenarios||[];
  const decisions=S.taches.filter(t=>t.bienId===id&&t.type==='decision'&&!t.fait);
  let h=`<p class="muted" style="max-width:68ch">Cet espace sert à préparer les décisions, à côté de la gestion courante. Rien ici ne change les chiffres du bien.</p>`;
  if(decisions.length) h+=`<div class="note">${ic('idea')}<div>${decisions.map(t=>`<b>${esc(t.titre)}</b> — ${rel(t.echeance)[0].toLowerCase()} (${dFR(t.echeance)})`).join('<br>')}</div></div>`;
  if(pl){
    const done=pl.etapes.filter(e=>e.fait).length;
    h+=`<section class="card"><div class="card-h"><div><h2>${esc(pl.titre)}</h2><p class="small muted">Objectif : ${esc(pl.horizon||'à définir')} · Budget estimé ${eur(pl.budget||0)}</p></div><button class="btn btn-g btn-sm" data-a="edit-plan" data-id="${id}">${ic('edit')}Modifier</button></div>
    ${pl.conditions?`<p class="small" style="margin-bottom:12px;max-width:70ch"><b>Conditions :</b> ${esc(pl.conditions)}</p>`:''}
    <div class="prog" style="margin-bottom:6px">${progress(pl.etapes.length?done/pl.etapes.length*100:0)}<span class="num">${done}/${pl.etapes.length} étapes</span></div>
    <div class="list">${pl.etapes.map(e=>`<div class="li ${e.fait?'done':''}"><button class="check ${e.fait?'on':''}" data-a="toggle-etape" data-id="${id}" data-e="${e.id}" aria-label="${e.fait?'Marquer à faire':'Marquer fait'}">${e.fait?ic('check'):''}</button><span class="tx"><b>${esc(e.titre)}</b></span><button class="iconbtn" data-a="del-etape" data-id="${id}" data-e="${e.id}" aria-label="Retirer l'étape">${ic('x')}</button></div>`).join('')}</div>
    <form class="filters" data-f="add-etape" data-id="${id}" style="margin-top:10px"><input class="in" id="etape-${id}" name="t" placeholder="Ajouter une étape" style="flex:1;min-width:180px" required><button class="btn btn-s" type="submit">${ic('plus')}Ajouter</button></form></section>`;
  }
  h+=`<section><div class="card-h"><h2>Scénarios à comparer</h2><button class="btn btn-s btn-sm" data-a="new-scen" data-id="${id}">${ic('plus')}Nouveau scénario</button></div>
  ${sc.length?`<div class="scen">${sc.map(s=>`<div class="card ${s.favori?'fav':''}"><div class="card-h" style="margin:0"><h3>${esc(s.titre)}</h3>${s.favori?badge(['Préféré','b-ok','star']):''}</div>
    <dl class="info"><dt>Revenu / an</dt><dd class="num">${s.revenu?eur(s.revenu):'—'}</dd><dt>Coût estimé</dt><dd class="num">${s.cout?eur(s.cout):'—'}</dd><dt>Délai</dt><dd>${esc(s.delai||'—')}</dd>${s.cout&&s.revenu?`<dt>Rentabilisé en</dt><dd>${(s.cout/s.revenu).toFixed(1).replace('.',',')} an${s.cout/s.revenu>=2?'s':''}</dd>`:''}</dl>
    ${s.notes?`<p class="small muted">${esc(s.notes)}</p>`:''}
    <div style="display:flex;gap:6px;margin-top:auto;flex-wrap:wrap"><button class="btn btn-s btn-sm" data-a="fav-scen" data-id="${id}" data-s="${s.id}">${ic('star')}${s.favori?'Retirer':'Préférer'}</button><button class="btn btn-g btn-sm" data-a="edit-scen" data-id="${id}" data-s="${s.id}">${ic('edit')}Modifier</button></div></div>`).join('')}</div>`:`<div class="card"><div class="empty">${ic('idea')}<span>Aucun scénario pour l'instant. Ajoutez-en un pour comparer les options (relouer, transformer, vendre…).</span></div></div>`}</section>`;
  if(!pl) h+=`<div><button class="btn btn-s" data-a="edit-plan" data-id="${id}">${ic('plus')}Préparer un projet pour ce bien</button></div>`;
  return h;
}

function vFinances(){
  const years=[...new Set(S.operations.map(o=>o.date.slice(0,4)).concat([CUR_YM.slice(0,4)]))].sort().reverse();
  const year=UI.finYear||CUR_YM.slice(0,4); const m=UI.finMonth; const bId=UI.finBien;
  let ops=periodOps(year,m,bId);
  const done=ops.filter(o=>o.statut!=='prevu');
  const rev=sum(done.filter(o=>o.type==='revenu'),o=>partFor(o,bId));
  const dep=sum(done.filter(o=>o.type==='depense'),o=>partFor(o,bId));
  const months = m==='all' ? Array.from({length:12},(_,i)=>`${year}-${pad(i+1)}`).filter(ym=>ym<=CUR_YM) : [`${year}-${m}`];
  const cred = bId==='all' ? sum(months, credits) : 0;
  const net=rev-dep-cred;
  const aPayer=sum(ops.filter(o=>o.type==='depense'&&o.statut==='a_payer'),o=>partFor(o,bId));
  const byCat={}; done.filter(o=>o.type==='depense').forEach(o=>byCat[o.categorie]=(byCat[o.categorie]||0)+partFor(o,bId));
  const byBien={}; done.filter(o=>o.type==='depense').forEach(o=>parts(o).forEach(p=>byBien[p.id]=(byBien[p.id]||0)+o.montant*p.part/100));
  const bTot=sum(Object.values(byBien));
  if(UI.finTab==='revenus') ops=ops.filter(o=>o.type==='revenu'); else if(UI.finTab==='depenses') ops=ops.filter(o=>o.type==='depense');
  const periodLbl = m==='all' ? `en ${year}` : `en ${MOIS_L[Number(m)-1]} ${year}`;
  return `<div class="head"><div><h1>Finances</h1><p class="sub">Revenus, dépenses et prêts ${periodLbl}${bId!=='all'?' · '+esc(bienNom(bId)):''}</p></div>
    <div class="head-actions"><button class="btn btn-s" data-a="new-op" data-type="revenu">${ic('in')}Revenu</button><button class="btn btn-p" data-a="new-op" data-type="depense">${ic('plus')}Ajouter une dépense</button></div></div>
  <div class="filters">
    <label class="sr" for="f-year" hidden>Année</label><select class="sel" id="f-year" data-ch="finYear" aria-label="Année">${years.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>
    <select class="sel" id="f-month" data-ch="finMonth" aria-label="Période"><option value="all">Toute l'année</option>${MOIS_L.map((x,i)=>`<option value="${pad(i+1)}" ${m===pad(i+1)?'selected':''}>${x.charAt(0).toUpperCase()+x.slice(1)}</option>`).join('')}</select>
    <select class="sel" id="f-bien" data-ch="finBien" aria-label="Bien"><option value="all">Tous les biens</option>${S.biens.map(b=>`<option value="${b.id}" ${bId===b.id?'selected':''}>${esc(b.nom)}</option>`).join('')}<option value="commun" ${bId==='commun'?'selected':''}>Patrimoine global (commun)</option></select>
    <a class="btn btn-g btn-sm" href="#prets">${ic('bank')}Mes prêts</a>
  </div>
  <section class="kpis">
    ${kpi('in','','Revenus', eurBig(rev), 'loyers et autres entrées')}
    ${kpi('out','o','Dépenses', eurBig(dep), aPayer?`${eur(aPayer)} encore à payer`:'tout est réglé')}
    ${kpi('bank','n','Crédits', eurBig(cred), bId==='all'?'mensualités des prêts':'non répartis par bien')}
    ${kpi('scale',net<0?'r':'','Résultat net', `<span class="${net<0?'neg':'pos'}">${eurBig(net,true)}</span>`, net<0?'les sorties dépassent les entrées':'entrées − sorties')}
  </section>
  ${m==='all'?`<section class="card"><div class="card-h"><h2>Évolution mensuelle ${year}</h2></div>${monthChart(year,bId)}</section>`:''}
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>Dépenses par catégorie</h2></div>${donut(byCat)}</section>
    <section class="card"><div class="card-h"><h2>Dépenses par bien</h2><span class="small muted">répartitions appliquées</span></div>
      ${bTot?`<div class="hbars">${Object.entries(byBien).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="r"><span>${esc(bienNom(k))}</span>${progress(v/bTot*100)}<span>${eur(v,false)}</span></div>`).join('')}</div>`:`<div class="empty">Pas de dépense sur cette période.</div>`}</section>
  </div>
  <section class="card"><div class="card-h"><div class="tabs" style="border:0">${[['global','Toutes'],['revenus','Revenus'],['depenses','Dépenses']].map(([k,l])=>`<button class="tab ${UI.finTab===k?'on':''}" data-a="fin-tab" data-tab="${k}">${l}</button>`).join('')}</div><span class="small muted">${ops.length} opération${ops.length>1?'s':''}</span></div>${opRows(ops,bId)}</section>`;
}

function vPrets(){
  return `<div class="head"><div><h1>Mes prêts</h1><p class="sub">${eur(sum(S.prets.filter(l=>loanActive(l,CUR_YM)),l=>l.mensualite))} de mensualités chaque mois</p></div><div class="head-actions"><button class="btn btn-p" data-a="new-pret">${ic('plus')}Ajouter un prêt</button></div></div>
  ${S.prets.map(l=>{
    const pct=(l.montant-l.restant)/l.montant*100; const nx=nextLoanDate(l);
    return `<section class="card"><div class="card-h"><div style="display:flex;gap:12px;align-items:center"><span class="ic" style="width:40px;height:40px;border-radius:10px;background:var(--sauge-pale);display:grid;place-items:center;color:var(--sapin)">${ic(l.type==='travaux'?'tools':'home')}</span><div><h2>${esc(l.nom)}</h2><p class="small muted">${esc(l.banque||'')}</p></div></div>${loanActive(l,CUR_YM)?badge(['En cours','b-ok','dot']):badge(['Terminé','b-res','check'])}</div>
    <div class="stat3"><div><span>Montant initial</span><b>${eur(l.montant)}</b></div><div><span>Mensualité</span><b>${eur(l.mensualite)}</b></div><div><span>Restant dû</span><b>${eur(l.restant)}</b></div><div><span>Taux</span><b>${String(l.taux).replace('.',',')} %</b></div></div>
    <div class="grid g2" style="margin-top:16px;align-items:end">
      <div><div class="prog">${progress(pct)}<span class="num">${Math.round(pct)} %</span></div><p class="small muted" style="margin-top:6px">${eur(l.montant-l.restant)} remboursés sur ${eur(l.montant)} · de ${dFR(l.debut)} à ${dFR(l.fin)}</p></div>
      ${l.type==='travaux'&&l.utilise!=null?`<div><div class="prog">${progress(l.utilise/l.montant*100,'o')}<span class="num">${Math.round(l.utilise/l.montant*100)} %</span></div><p class="small muted" style="margin-top:6px">Budget travaux : ${eur(l.utilise)} utilisés, <b>${eur(l.montant-l.utilise)} encore disponibles</b></p></div>`:'<div></div>'}
    </div>
    <div class="filters" style="margin-top:14px;justify-content:space-between"><span class="small">Prochaine échéance : <b>${dFR(nx)}</b> · ${eur(l.mensualite)}</span><button class="btn btn-s btn-sm" data-a="edit-pret" data-id="${l.id}">${ic('edit')}Mettre à jour</button></div></section>`;}).join('')}
  <div class="note">${ic('idea')}<div>Pensez à mettre à jour le <b>restant dû</b> une fois par an, à partir du tableau d'amortissement envoyé par la banque.</div></div>`;
}

function projCard(p){
  const t=projetTotals(p); const b=bien(p.biens[0]);
  const st={en_cours:['En cours','b-ok','dot'],a_venir:['À venir','b-info','cal'],termine:['Terminé','b-res','check']}[p.statut];
  return `<article class="card proj"><a class="illu" href="#projet-${p.id}" aria-label="${esc(p.nom)}">${p.photos&&p.photos[0]?`<img ${srcAttr(p.photos[0])} alt="">`:(b?bImg(b):illu('maison'))}</a>
    <div class="t" style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(p.nom)}</h3>${badge(st)}</div>
    <p class="small muted">${p.biens.map(bienNom).join(' + ')}</p>
    <div class="prog">${progress(p.progression)}<span class="num">${p.progression} %</span></div>
    <div class="proj-n"><div><span>Budget prévu</span><b>${eur(p.budget)}</b></div><div><span>Dépensé</span><b>${eur(t.paye)}</b></div><div><span>Reste à prévoir</span><b class="${t.reste<0?'neg':''}">${eur(t.reste)}</b></div></div>
    <a class="btn btn-s" href="#projet-${p.id}" style="margin-top:auto">Voir le projet ${ic('arrow')}</a></article>`;
}
function vTravaux(){
  const f=UI.travFilter; const list=S.projets.filter(p=>f==='all'||p.statut===f);
  const n=k=>S.projets.filter(p=>p.statut===k).length;
  return `<div class="head"><div><h1>Mes projets de travaux</h1><p class="sub">Un chantier est un projet : budget, artisans, factures et prochaines actions.</p></div><div class="head-actions"><button class="btn btn-p" data-a="new-projet">${ic('plus')}Nouveau projet</button></div></div>
  <div class="pills">${[['all',`Tous (${S.projets.length})`],['en_cours',`En cours (${n('en_cours')})`],['a_venir',`À venir (${n('a_venir')})`],['termine',`Terminés (${n('termine')})`]].map(([k,l])=>`<button class="pill ${f===k?'on':''}" data-a="trav-filter" data-f="${k}">${l}</button>`).join('')}</div>
  ${list.length?`<div class="biens">${list.map(projCard).join('')}</div>`:`<div class="card"><div class="empty">${ic('tools')}<span>Aucun projet dans cette catégorie.</span></div></div>`}`;
}
function vProjet(id){
  const p=S.projets.find(p=>p.id===id); if(!p) return `<a class="back" href="#travaux">${ic('back')}Retour aux projets</a><div class="empty">Ce projet n'existe plus.</div>`;
  const t=projetTotals(p);
  const st={en_cours:['En cours','b-ok','dot'],a_venir:['À venir','b-info','cal'],termine:['Terminé','b-res','check']}[p.statut];
  const over=t.engage>p.budget;
  return `<div><a class="back" href="#travaux">${ic('back')}Retour aux projets</a>
  <div class="head"><div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h1>${esc(p.nom)}</h1>${badge(st)}</div><p class="sub">${p.biens.map(id=>`<a href="#bien-${id}">${esc(bienNom(id))}</a>`).join(' + ')}</p></div>
  <div class="head-actions"><button class="btn btn-s" data-a="edit-projet" data-id="${id}">${ic('edit')}Modifier</button><button class="btn btn-p" data-a="new-op" data-type="depense" data-projet="${id}">${ic('plus')}Ajouter une dépense</button></div></div></div>
  <div class="split">
    <div class="col">
      <section class="card"><div class="card-h"><h2>Budget et avancement</h2></div>
        <div class="stat3"><div><span>Budget prévu</span><b>${eur(p.budget)}</b></div><div><span>Engagé</span><b>${eur(t.engage)}</b></div><div><span>Dépensé</span><b>${eur(t.paye)}</b></div><div><span>Reste à prévoir</span><b class="${t.reste<0?'neg':''}">${eur(t.reste)}</b></div></div>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
          <div><div class="small muted" style="margin-bottom:4px">Budget utilisé</div><div class="prog">${progress(t.engage/p.budget*100, over?'r':'o')}<span class="num">${Math.round(t.engage/p.budget*100)} %</span></div>${over?`<p class="err" style="margin-top:4px">${ic('alert').replace('<svg','<svg width="14" height="14" style="vertical-align:-2px"')} Le budget est dépassé de ${eur(t.engage-p.budget)}.</p>`:''}</div>
          <div><label class="small muted" for="prog-${id}">Avancement du chantier : <b class="num" id="progv">${p.progression} %</b></label><input type="range" id="prog-${id}" min="0" max="100" step="5" value="${p.progression}" data-in="progression" data-id="${id}" style="width:100%;accent-color:#285548"></div>
        </div></section>
      <section class="card"><div class="card-h"><h2>Prochaines actions</h2></div>
        <div class="list">${p.actions.map(a=>`<div class="li ${a.fait?'done':''}"><button class="check ${a.fait?'on':''}" data-a="toggle-action" data-id="${id}" data-e="${a.id}" aria-label="Basculer">${a.fait?ic('check'):''}</button><span class="tx"><b>${esc(a.titre)}</b></span><button class="iconbtn" data-a="del-action" data-id="${id}" data-e="${a.id}" aria-label="Retirer">${ic('x')}</button></div>`).join('')||'<p class="muted small">Aucune action prévue.</p>'}</div>
        <form class="filters" data-f="add-action" data-id="${id}" style="margin-top:10px"><input class="in" id="act-${id}" name="t" placeholder="Ajouter une action" style="flex:1;min-width:180px" required><button class="btn btn-s" type="submit">${ic('plus')}Ajouter</button></form></section>
    </div>
    <div class="col">
      <section class="card"><h2 style="margin-bottom:10px">Description</h2><p style="max-width:65ch">${esc(p.description||'—')}</p>
        <dl class="info" style="margin-top:14px"><dt>Début</dt><dd>${dFR(p.debut)}</dd><dt>Fin prévue</dt><dd>${dFR(p.finPrevue)}</dd><dt>Fin réelle</dt><dd>${p.finReelle?dFR(p.finReelle):'—'}</dd><dt>Artisans</dt><dd>${p.fournisseurs.map(esc).join(', ')||'—'}</dd></dl></section>
      <section class="card"><div class="card-h"><h2>Photos</h2><label class="btn btn-s btn-sm" for="ph-${id}">${ic('photo')}Ajouter</label><input type="file" id="ph-${id}" accept="image/*" hidden data-up="photo" data-id="${id}"></div>
        ${p.photos.length?`<div class="thumbs">${p.photos.map(u=>`<a ${hrefAttr(u)} target="_blank" rel="noopener"><img ${srcAttr(u)} alt="Photo du chantier"></a>`).join('')}</div>`:`<p class="muted small">Ajoutez des photos avant, pendant et après les travaux.</p>`}</section>
    </div>
  </div>
  <section class="card"><div class="card-h"><h2>Dépenses et factures</h2><span class="small muted">${t.ops.length} ligne${t.ops.length>1?'s':''}</span></div>${opRows(t.ops,'all',{empty:'Aucune dépense liée. Ajoutez-en une avec le bouton en haut.'})}</section>`;
}

function docIcon(d){ const e=(d.ext||'').toLowerCase(); const c=['jpg','jpeg','png','webp','heic'].includes(e)?'i':['doc','docx'].includes(e)?'w':''; return `<span class="doc-ic ${c}">${esc((e||'doc').toUpperCase().slice(0,4))}</span>`; }
function docList(docs){
  if(!docs.length) return `<div class="empty">${ic('file')}<span>Aucun document ici.</span></div>`;
  return `<div class="list">${docs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<div class="li">${docIcon(d)}<span class="tx" data-a="edit-doc" data-id="${d.id}" style="cursor:pointer"><b>${esc(d.nom)}</b><span>${esc(d.categorie)} · ${d.bienId?esc(bienNom(d.bienId)):'Commun'} · ${dFR(d.date)}${d.taille?' · '+fileSize(d.taille):''}</span></span>${d.url?`<a class="btn btn-s btn-sm" ${hrefAttr(d.url)} target="_blank" rel="noopener">Ouvrir</a>`:`<span class="badge">Exemple, sans fichier</span>`}</div>`).join('')}</div>`;
}
function vDocuments(){
  const q=UI.docQ.trim().toLowerCase(); const f=UI.docBien;
  const list=S.documents.filter(d=>(f==='all'||(f==='commun'?!d.bienId:d.bienId===f)) && (!q||(d.nom+' '+d.categorie).toLowerCase().includes(q)));
  return `<div class="head"><div><h1>Documents</h1><p class="sub">${S.documents.length} documents classés par bien</p></div><div class="head-actions"><button class="btn btn-p" data-a="new-doc">${ic('upload')}Ajouter un document</button></div></div>
  <div class="filters"><div class="pills">${[['all','Tous'],...S.biens.map(b=>[b.id,b.nom]),['commun','Communs']].map(([k,l])=>`<button class="pill ${f===k?'on':''}" data-a="doc-filter" data-f="${k}">${esc(l)}</button>`).join('')}</div>
  <div class="search">${ic('search')}<input class="in" id="doc-q" type="search" placeholder="Rechercher un document" value="${esc(UI.docQ)}" data-in="docQ" aria-label="Rechercher"></div></div>
  <section class="card" id="doc-list">${docList(list)}</section>`;
}
function vAFaire(){
  const items=todoItems();
  const late=items.filter(i=>days(i.date)<0), week=items.filter(i=>days(i.date)>=0&&days(i.date)<=7), later=items.filter(i=>days(i.date)>7);
  const dec=S.taches.filter(t=>t.type==='decision'&&!t.fait).sort((a,b)=>a.echeance.localeCompare(b.echeance));
  const done=S.taches.filter(t=>t.fait);
  const blk=(t,arr,hint)=>arr.length?`<section class="card"><div class="card-h"><h2>${t}</h2><span class="small muted">${hint||''}</span></div><div class="list">${arr.map(todoLi).join('')}</div></section>`:'';
  return `<div class="head"><div><h1>À faire</h1><p class="sub">${items.length} action${items.length>1?'s':''} en cours · paiements, rappels et projets</p></div><div class="head-actions"><button class="btn btn-p" data-a="new-task">${ic('plus')}Nouvelle tâche</button></div></div>
  ${!items.length?`<div class="card"><div class="empty">${ic('check')}<span>Tout est à jour.</span></div></div>`:''}

/* ---------- Fiscalité ---------- */
function fiscYearDefault(){ const y=Number(CUR_YM.slice(0,4)), m=Number(CUR_YM.slice(5)); return String(m>=7?y:y-1); }
function fiscCalc(Y){
  Y=String(Y); const isCur=Y===CUR_YM.slice(0,4);
  const revOps=S.operations.filter(o=>o.type==='revenu'&&o.date.slice(0,4)===Y&&o.categorie!=='Charges récupérées');
  const locIds=[...new Set(revOps.filter(o=>o.categorie==='Loyer').flatMap(o=>parts(o).map(p=>p.id)).filter(id=>id!=='commun'))];
  const encaisse=sum(revOps.filter(o=>o.statut==='paye'),o=>o.montant);
  const attendu=sum(revOps.filter(o=>o.statut!=='prevu'),o=>o.montant);
  const projection = isCur ? attendu + sum(S.biens.filter(b=>b.statut==='loue'),b=>b.loyer)*(12-Number(CUR_YM.slice(5))) : encaisse;
  const lignes=[]; let horsBien=0;
  for(const o of S.operations){
    if(o.type!=='depense'||o.date.slice(0,4)!==Y||o.statut!=='paye') continue;
    if(o.repart.mode==='global'){ horsBien++; continue; }
    const ps=o.repart.parts.filter(p=>locIds.includes(p.id)); if(!ps.length) continue;
    const share=sum(ps,p=>p.part)/100; const teom=(o.teom||0)*share;
    const auto=DEDUCT_DEFAULT[o.categorie]??false; const ded=o.deductible==null?auto:o.deductible;
    lignes.push({o, montant:o.montant*share-teom, teom, ded, biens:ps.map(p=>bienNom(p.id)).join(' + '), partiel:share<0.999});
  }
  lignes.sort((a,b)=>a.o.date.localeCompare(b.o.date));
  const charges=sum(lignes.filter(l=>l.ded),l=>l.montant);
  const frais=FRAIS_GESTION*locIds.length;
  const interets=Number(S.fiscal.interets?.[Y])||0;
  const resultat=encaisse-charges-frais-interets;
  const deficitGlobal = resultat<0 ? Math.max(0,(charges+frais)-Math.max(0,encaisse-interets)) : 0;
  const imputable=Math.min(deficitGlobal,DEFICIT_PLAF);
  const reportable=resultat<0 ? -resultat-imputable : 0;
  const microOK=(isCur?projection:encaisse)<=MICRO_SEUIL;
  const microBase=encaisse*(1-MICRO_ABATT);
  const reelBase=Math.max(0,resultat);
  const regime=!microOK?'reel':(reelBase<microBase?'reel':'micro');
  const base=regime==='micro'?microBase:reelBase;
  const tmi=S.fiscal.tmi;
  const impot = tmi==null ? null : base*(tmi/100+PRELEV_SOCIAUX);
  const economie = tmi==null||regime!=='reel' ? null : imputable*tmi/100;
  const sansJustif=lignes.filter(l=>l.ded&&!l.o.justif).length;
  return {Y,isCur,locIds,encaisse,attendu,projection,lignes,horsBien,charges,frais,interets,resultat,deficitGlobal,imputable,reportable,microOK,microBase,reelBase,regime,base,impot,economie,sansJustif};
}
function fiscZone(){
  const d=String(S.fiscal?.departement||'').toUpperCase();
  if(/^2[AB]$/.test(d)) return 2;
  const n=parseInt(d,10); if(isNaN(n)) return 0;
  return n<=19?1:n<=54?2:3;
}
function fiscDeadlines(){
  const y0=Number(TODAY.slice(0,4)); const out=[]; const z=fiscZone();
  const lim={1:'05-21',2:'05-28',3:'06-04'}[z]||'05-28';
  const mk=(md,titre,detail,exact=[])=>{ for(const y of [y0,y0+1]){ const date=`${y}-${md}`; if(days(date)>=-2){ out.push({date,titre:titre.replace('{Y}',y-1),detail,indicatif:exact.length>0&&!exact.includes(y)}); return; } } };
  mk('02-15',"Saisir les intérêts d'emprunt de {Y}","À partir de l'attestation annuelle de la banque, dans les réglages fiscaux.");
  mk('04-09','Ouverture de la déclaration des revenus {Y}','Sur impots.gouv.fr. Revenus fonciers au régime réel : formulaire 2044.',[2026]);
  mk(lim,'Date limite : déclaration des revenus {Y} en ligne',z?`Date pour votre département (${esc(S.fiscal.departement)}).`:'Indiquez votre département dans les réglages pour avoir la bonne date.',[2026]);
  mk('07-01',"Signaler les changements d'occupation",'Espace « Gérer mes biens immobiliers ». Seulement si un bien a changé d\'occupant (nouveau locataire, logement repris).');
  mk('10-15','Payer la taxe foncière','Le 15 octobre, ou le 20 octobre en paiement en ligne. Rien à faire si vous êtes mensualisé.',[2026]);
  mk('11-15',"Refacturer la taxe d'ordures ménagères",'Demandez aux locataires la part TEOM de l\'avis de taxe foncière.');
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
